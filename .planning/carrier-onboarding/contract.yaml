openapi: 3.1.0
info:
  title: Carrier Onboarding API
  description: |
    Carrier onboarding endpoints spanning 3 phases:
    - Phase 1: Invite-only portal + conversational interview + signing + approval
    - Phase 2: Self-registration + FMCSA verification + tier classification
    - Phase 3: Post-activation workflows (reminders, document expiry, cost profile V2)
  version: 1.0.0

servers:
  - url: /api/v1

# ─────────────────────────────────────────────
# Auth
# ─────────────────────────────────────────────
security:
  - cookieAuth: []

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: accessToken
      description: JWT access token in HttpOnly cookie. Injected by requireAuth middleware.
    portalToken:
      type: http
      scheme: bearer
      description: |
        Carrier portal token. Sent as `Authorization: Bearer <token>` header
        or `?token=<token>` query param. Validated by authenticateCarrierToken middleware.

  # ─────────────────────────────────────────────
  # Schemas
  # ─────────────────────────────────────────────
  schemas:

    # ── Enums ──────────────────────────────────

    OnboardingStatus:
      type: string
      enum: [NOT_STARTED, IN_PROGRESS, COMPLETED, APPROVED, REJECTED]
      x-display-names:
        NOT_STARTED: "Not Started"
        IN_PROGRESS: "In Progress"
        COMPLETED: "Completed"
        APPROVED: "Approved"
        REJECTED: "Rejected"

    VehicleCategory:
      type: string
      enum: [SEMI_TRUCK, BOX_TRUCK, CARGO_VAN, PERSONAL_VEHICLE]
      x-display-names:
        SEMI_TRUCK: "Semi Truck"
        BOX_TRUCK: "Box Truck"
        CARGO_VAN: "Cargo Van"
        PERSONAL_VEHICLE: "Personal Vehicle"

    VehicleComplianceRules:
      type: object
      description: "Compliance requirements per vehicle category — shared source of truth for FE branching and BE validation"
      additionalProperties: false
      properties:
        SEMI_TRUCK:
          $ref: '#/components/schemas/VehicleCategoryCompliance'
        BOX_TRUCK:
          $ref: '#/components/schemas/VehicleCategoryCompliance'
        CARGO_VAN:
          $ref: '#/components/schemas/VehicleCategoryCompliance'
        PERSONAL_VEHICLE:
          $ref: '#/components/schemas/VehicleCategoryCompliance'

    VehicleCategoryCompliance:
      type: object
      required: [mcAuthority, dotRegistration, cdlRequired, insuranceMinimums]
      properties:
        mcAuthority:
          type: string
          enum: [REQUIRED, OPTIONAL, NOT_REQUIRED]
        dotRegistration:
          type: string
          enum: [REQUIRED, OPTIONAL, NOT_REQUIRED, GVWR_DEPENDENT]
        cdlRequired:
          type: boolean
        gvwrThresholds:
          type: object
          description: "Only applicable for BOX_TRUCK"
          properties:
            greenMax:
              type: integer
              description: "Below this weight: no DOT needed"
              example: 10000
            amberMax:
              type: integer
              description: "Below this weight: DOT optional (intrastate)"
              example: 26000
            redMin:
              type: integer
              description: "At or above this weight: DOT required (federal)"
              example: 26001
        insuranceMinimums:
          $ref: '#/components/schemas/InsuranceMinimums'
        nonCdlCallout:
          type: boolean
          description: "Show non-CDL regulatory requirements card (LLC, business bank, EIN, commercial auto rider)"
        deliveryTypesRequired:
          type: boolean
          description: "Require delivery type selection (PERSONAL_VEHICLE only)"

    InsuranceMinimums:
      type: object
      required: [commercialAutoLiability]
      properties:
        commercialAutoLiability:
          type: integer
          description: "Minimum commercial auto liability in dollars"
        cargoInsurance:
          type: integer
          description: "Minimum cargo insurance in dollars (not all types require this)"
        requiresCommercialAutoRider:
          type: boolean
          description: "Personal vehicle: requires commercial auto rider on personal policy"

    x-vehicle-compliance-values:
      description: "Concrete compliance values — the actual rules"
      SEMI_TRUCK:
        mcAuthority: REQUIRED
        dotRegistration: REQUIRED
        cdlRequired: true
        insuranceMinimums:
          commercialAutoLiability: 1000000
          cargoInsurance: 100000
        nonCdlCallout: false
        deliveryTypesRequired: false
      BOX_TRUCK:
        mcAuthority: OPTIONAL
        dotRegistration: GVWR_DEPENDENT
        cdlRequired: false
        gvwrThresholds:
          greenMax: 10000
          amberMax: 26000
          redMin: 26001
        insuranceMinimums:
          commercialAutoLiability: 300000
          cargoInsurance: 100000
        nonCdlCallout: false
        deliveryTypesRequired: false
      CARGO_VAN:
        mcAuthority: OPTIONAL
        dotRegistration: NOT_REQUIRED
        cdlRequired: false
        insuranceMinimums:
          commercialAutoLiability: 300000
        nonCdlCallout: true
        deliveryTypesRequired: false
      PERSONAL_VEHICLE:
        mcAuthority: NOT_REQUIRED
        dotRegistration: NOT_REQUIRED
        cdlRequired: false
        insuranceMinimums:
          commercialAutoLiability: 300000
          requiresCommercialAutoRider: true
        nonCdlCallout: true
        deliveryTypesRequired: true

    DeliveryType:
      type: string
      enum: [COURIER, LAST_MILE, MEDICAL_COURIER, GROCERY, PHARMACY, OTHER]
      x-display-names:
        COURIER: "Courier"
        LAST_MILE: "Last Mile"
        MEDICAL_COURIER: "Medical Courier"
        GROCERY: "Grocery"
        PHARMACY: "Pharmacy"
        OTHER: "Other"

    NonCdlRequirementStatus:
      type: string
      enum: [REQUIRED, RECOMMENDED]

    NonCdlRequirement:
      type: object
      required: [label, status]
      properties:
        label:
          type: string
        status:
          $ref: '#/components/schemas/NonCdlRequirementStatus'
        description:
          type: string

    x-non-cdl-requirements:
      description: "Non-CDL regulatory callout items for cargo van and personal vehicle operators"
      items:
        - label: "Commercial Auto Insurance Rider"
          status: REQUIRED
          description: "Required to operate as a commercial carrier"
        - label: "LLC or Business Entity"
          status: RECOMMENDED
          description: "Protects personal assets"
        - label: "Business Bank Account"
          status: RECOMMENDED
          description: "Required for ACH settlement payments"
        - label: "EIN (Employer Identification Number)"
          status: REQUIRED
          description: "Required for year-end 1099 filing"

    MedicalCourierCompliance:
      type: object
      properties:
        transportsPharma:
          type: boolean
          description: "Does the carrier transport pharmaceuticals?"
        controlledSubstances:
          type: boolean
          description: "If transportsPharma is true, do those include controlled substances?"
        complianceCallRequired:
          type: boolean
          description: "System-set flag: true if transportsPharma is true. Dispatcher must schedule verification call."

    CarrierType:
      type: string
      enum: [COMPANY_ASSET, OWNER_OPERATOR, EXTERNAL_CARRIER]
      x-display-names:
        COMPANY_ASSET: "Company Asset"
        OWNER_OPERATOR: "Owner Operator"
        EXTERNAL_CARRIER: "External Carrier"

    CarrierStatus:
      type: string
      enum: [ACTIVE, PENDING, SUSPENDED, DRAFT]
      x-display-names:
        ACTIVE: "Active"
        PENDING: "Pending"
        SUSPENDED: "Suspended"
        DRAFT: "Draft"

    EntryMethod:
      type: string
      enum: [INVITE, SELF_REGISTER]
      x-display-names:
        INVITE: "Invite"
        SELF_REGISTER: "Self-Register"

    CostProfileSource:
      type: string
      enum: [onboarding_estimate, dispatcher_review]
      x-display-names:
        onboarding_estimate: "Onboarding Estimate"
        dispatcher_review: "Dispatcher Review"

    DocumentReviewStatus:
      type: string
      enum: [pending_review, approved, rejected]
      x-display-names:
        pending_review: "Pending Review"
        approved: "Approved"
        rejected: "Rejected"

    DocumentType:
      type: string
      enum: [DISPATCH_AGREEMENT, INSURANCE_CERT, W_9, CARRIER_PACKET]
      x-display-names:
        DISPATCH_AGREEMENT: "Dispatch Agreement"
        INSURANCE_CERT: "Insurance Certificate"
        W_9: "W-9"
        CARRIER_PACKET: "Carrier Packet"

    InsuranceWarning:
      type: string
      enum: [30_DAY, 7_DAY, EXPIRED]
      nullable: true
      x-display-names:
        30_DAY: "Expiring in 30 days"
        7_DAY: "Expiring in 7 days"
        EXPIRED: "Expired"

    TierClassification:
      type: string
      enum: [TIER_A, TIER_B, TIER_C]
      x-display-names:
        TIER_A: "Tier A — Sign Immediately"
        TIER_B: "Tier B — First-Load Supervision"
        TIER_C: "Tier C — Do Not Sign Year One"

    FmcsaAuthorityStatus:
      type: string
      enum: [AUTHORIZED, NOT_AUTHORIZED, REVOKED, OUT_OF_SERVICE]
      x-display-names:
        AUTHORIZED: "Authorized"
        NOT_AUTHORIZED: "Not Authorized"
        REVOKED: "Revoked"
        OUT_OF_SERVICE: "Out of Service"

    FmcsaSafetyRating:
      type: string
      enum: [SATISFACTORY, CONDITIONAL, UNSATISFACTORY, NOT_RATED]
      x-display-names:
        SATISFACTORY: "Satisfactory"
        CONDITIONAL: "Conditional"
        UNSATISFACTORY: "Unsatisfactory"
        NOT_RATED: "Not Rated"

    PayType:
      type: string
      enum: [PERCENTAGE, PER_MILE, FLAT_RATE]
      x-display-names:
        PERCENTAGE: "Percentage"
        PER_MILE: "Per Mile"
        FLAT_RATE: "Flat Rate"

    FreightPreference:
      type: string
      enum: [DRY_VAN, REEFER, FLATBED, STEP_DECK, POWER_ONLY, HOTSHOT, BOX_TRUCK, SPRINTER_VAN]
      x-display-names:
        DRY_VAN: "Dry Van"
        REEFER: "Reefer"
        FLATBED: "Flatbed"
        STEP_DECK: "Step Deck"
        POWER_ONLY: "Power Only"
        HOTSHOT: "Hotshot"
        BOX_TRUCK: "Box Truck"
        SPRINTER_VAN: "Sprinter/Cargo Van"

    StatePreference:
      type: string
      enum: [NEUTRAL, PREFERRED, AVOIDED]
      x-display-names:
        NEUTRAL: "Neutral"
        PREFERRED: "Preferred"
        AVOIDED: "Avoided"

    # ── Common ─────────────────────────────────

    PaginationMeta:
      type: object
      required: [page, limit, total, totalPages, hasMore]
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
        hasMore:
          type: boolean

    ErrorResponse:
      type: object
      required: [errors]
      properties:
        errors:
          type: array
          items:
            type: object
            required: [message]
            properties:
              message:
                type: string
              field:
                type: string

    # ── Onboarding Session ─────────────────────

    OnboardingSession:
      type: object
      required: [id, carrierId, currentPhase, completedPhases, lastActiveAt, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        carrierId:
          type: string
          format: uuid
        currentPhase:
          type: integer
          minimum: 1
          maximum: 6
          description: "Current interview phase (1=Company, 2=Equipment, 3=Drivers, 4=Cost Analysis, 5=Lane Preferences, 6=Documents)"
        currentQuestionIndex:
          type: integer
          minimum: 0
          description: "Index of the current question within the current phase"
        answers:
          type: object
          description: "JSON object keyed by question ID with carrier's answers — auto-saved per answer"
          additionalProperties: true
        completedPhases:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 6
        lastActiveAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        remindersSent:
          type: integer
          minimum: 0
          description: "Phase 3: count of reminders sent"
        lastReminderAt:
          type: string
          format: date-time
          nullable: true
          description: "Phase 3: timestamp of last reminder"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ── Carrier (summary for portal) ───────────

    CarrierPortalSummary:
      type: object
      required: [id, name, onboardingStatus]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        onboardingStatus:
          $ref: '#/components/schemas/OnboardingStatus'
        type:
          $ref: '#/components/schemas/CarrierType'

    # ── Portal Session Response ────────────────

    PortalSessionResponse:
      type: object
      required: [session, carrier]
      properties:
        session:
          $ref: '#/components/schemas/OnboardingSession'
        carrier:
          $ref: '#/components/schemas/CarrierPortalSummary'

    # ── Step Save Requests ─────────────────────

    SaveCompanyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 255
          minLength: 1
        mcNumber:
          type: string
          maxLength: 20
          pattern: "^[0-9]{1,8}$"
        dotNumber:
          type: string
          maxLength: 20
          pattern: "^[0-9]{1,8}$"
        ein:
          type: string
          maxLength: 20
          pattern: "^[0-9]{2}-?[0-9]{7}$"
        phone:
          type: string
          maxLength: 20
        email:
          type: string
          format: email
          maxLength: 255
        address:
          type: string
          maxLength: 500
        city:
          type: string
          maxLength: 100
        state:
          type: string
          maxLength: 2
          minLength: 2
        zip:
          type: string
          maxLength: 10
          pattern: "^[0-9]{5}(-[0-9]{4})?$"
        primaryContactName:
          type: string
          maxLength: 255
        primaryContactPhone:
          type: string
          maxLength: 20
        primaryContactEmail:
          type: string
          format: email
          maxLength: 255
        factoringCompanyName:
          type: string
          maxLength: 255
        factoringCompanyEmail:
          type: string
          format: email
          maxLength: 255
        factoringSubmissionMethod:
          type: string
          maxLength: 50
        factoringAdvanceRate:
          type: number
          minimum: 0
          maximum: 100
        factoringFeePercent:
          type: number
          minimum: 0
          maximum: 100
        fuelCardProviders:
          type: array
          items:
            type: string
            maxLength: 100
          maxItems: 10
        howFoundUs:
          type: string
          maxLength: 255

    VehicleEntry:
      type: object
      required: [category]
      properties:
        category:
          $ref: '#/components/schemas/VehicleCategory'
        year:
          type: integer
          minimum: 1990
          maximum: 2030
        make:
          type: string
          maxLength: 100
        model:
          type: string
          maxLength: 100
        vin:
          type: string
          maxLength: 17
          minLength: 17
          pattern: "^[A-HJ-NPR-Z0-9]{17}$"
        licensePlate:
          type: string
          maxLength: 20
        gvwr:
          type: integer
          minimum: 0
          maximum: 100000
          description: "Gross Vehicle Weight Rating — required for BOX_TRUCK"
        lenderName:
          type: string
          maxLength: 255
        loanPayment:
          type: number
          minimum: 0
          maximum: 99999999.99
        loanInterestRate:
          type: number
          minimum: 0
          maximum: 100
        insuranceMonthlyCost:
          type: number
          minimum: 0
          maximum: 99999999.99
        deliveryTypes:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryType'
          description: "For PERSONAL_VEHICLE only — required when category is PERSONAL_VEHICLE"
        insuranceAttested:
          type: boolean
          description: "Carrier attests their policy meets minimum coverage for this vehicle category"
        insuranceAttestedAt:
          type: string
          format: date-time
          description: "Timestamp of attestation — legal record"

    SaveEquipmentRequest:
      type: object
      required: [vehicles]
      properties:
        vehicles:
          type: array
          items:
            $ref: '#/components/schemas/VehicleEntry'
          minItems: 1
          maxItems: 50
        medicalCourierCompliance:
          $ref: '#/components/schemas/MedicalCourierCompliance'

    DriverEntry:
      type: object
      required: [firstName, lastName]
      properties:
        firstName:
          type: string
          maxLength: 100
          minLength: 1
        lastName:
          type: string
          maxLength: 100
          minLength: 1
        phone:
          type: string
          maxLength: 20
        email:
          type: string
          format: email
          maxLength: 255
        payType:
          $ref: '#/components/schemas/PayType'
        payRate:
          type: number
          minimum: 0
          maximum: 100
          description: "Percentage or per-mile rate depending on payType"

    SaveDriversRequest:
      type: object
      required: [hasAdditionalDrivers]
      properties:
        hasAdditionalDrivers:
          type: boolean
        drivers:
          type: array
          items:
            $ref: '#/components/schemas/DriverEntry'
          maxItems: 50

    SaveCostAnalysisRequest:
      type: object
      required: [truckPayment, insuranceCost, fuelCostPerGallon, milesPerGallon, maintenanceMonthlyCost, otherMonthlyCosts]
      properties:
        truckPayment:
          type: number
          minimum: 0
          maximum: 99999999.99
          description: "Monthly truck payment. 0 if owned outright."
        insuranceCost:
          type: number
          minimum: 0
          maximum: 99999999.99
          description: "Monthly insurance cost"
        fuelCostPerGallon:
          type: number
          minimum: 0
          maximum: 20
          description: "Current fuel cost per gallon"
        milesPerGallon:
          type: number
          minimum: 1
          maximum: 30
          description: "Average fuel efficiency"
        maintenanceMonthlyCost:
          type: number
          minimum: 0
          maximum: 99999999.99
          description: "Monthly maintenance/repair budget"
        otherMonthlyCosts:
          type: number
          minimum: 0
          maximum: 99999999.99
          description: "Other monthly costs (tolls, permits, subscriptions, etc.)"

    CostAnalysisResult:
      type: object
      required: [breakEvenRpm, minimumRatePerMile, totalMonthlyExpenses, fuelCostPerMile, projectedNetPerMonth, revenuePerMile, costProfileVersion, costProfileSource]
      properties:
        breakEvenRpm:
          type: number
          description: "Break-even revenue per mile (before profit)"
        minimumRatePerMile:
          type: number
          description: "Minimum acceptable rate per mile (with margin)"
        totalMonthlyExpenses:
          type: number
          description: "Sum of all monthly costs"
        fuelCostPerMile:
          type: number
          description: "Fuel cost per mile (fuelCostPerGallon / milesPerGallon)"
        projectedNetPerMonth:
          type: number
          description: "Projected net income per month at minimum rate"
        revenuePerMile:
          type: number
          description: "Revenue per mile at minimum rate"
        costProfileVersion:
          type: integer
          minimum: 1
        costProfileSource:
          $ref: '#/components/schemas/CostProfileSource'

    LanePreferenceEntry:
      type: object
      properties:
        origin:
          type: string
          maxLength: 100
          description: "Origin city or region"
        destination:
          type: string
          maxLength: 100
          description: "Destination city or region"

    StatePreferenceEntry:
      type: object
      required: [state, preference]
      properties:
        state:
          type: string
          minLength: 2
          maxLength: 2
          description: "US state abbreviation"
        preference:
          $ref: '#/components/schemas/StatePreference'

    SaveLanePreferencesRequest:
      type: object
      properties:
        homeBaseCity:
          type: string
          maxLength: 100
        homeBaseState:
          type: string
          maxLength: 2
          minLength: 2
        maxDaysOut:
          type: integer
          minimum: 1
          maximum: 30
        preferredLanes:
          type: array
          items:
            $ref: '#/components/schemas/LanePreferenceEntry'
          maxItems: 20
        statePreferences:
          type: array
          items:
            $ref: '#/components/schemas/StatePreferenceEntry'
          maxItems: 50
        freightPreferences:
          type: array
          items:
            $ref: '#/components/schemas/FreightPreference'

    # ── Document Schemas ───────────────────────

    PortalDocument:
      type: object
      required: [id, documentType, reviewStatus, createdAt]
      properties:
        id:
          type: string
          format: uuid
        documentType:
          $ref: '#/components/schemas/DocumentType'
        fileName:
          type: string
        fileUrl:
          type: string
          format: uri
        reviewStatus:
          $ref: '#/components/schemas/DocumentReviewStatus'
        signatureData:
          type: string
          description: "Base64-encoded signature image"
        signedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    PresignRequest:
      type: object
      required: [fileName, contentType, documentType]
      properties:
        fileName:
          type: string
          maxLength: 255
          minLength: 1
        contentType:
          type: string
          maxLength: 100
          pattern: "^[a-z]+/[a-z0-9.+-]+$"
        documentType:
          $ref: '#/components/schemas/DocumentType'

    PresignResponse:
      type: object
      required: [documentId, uploadUrl, fields]
      properties:
        documentId:
          type: string
          format: uuid
        uploadUrl:
          type: string
          format: uri
        fields:
          type: object
          additionalProperties:
            type: string

    ConfirmUploadRequest:
      type: object
      required: [documentType]
      properties:
        documentType:
          $ref: '#/components/schemas/DocumentType'
        insuranceExpiry:
          type: string
          format: date-time
          description: "Required for INSURANCE_CERT documents"
        coverageConfirmed:
          type: boolean
          description: "Carrier confirms adequate coverage for INSURANCE_CERT"

    SignDocumentRequest:
      type: object
      required: [signatureData, consentGiven]
      properties:
        signatureData:
          type: string
          minLength: 1
          description: "Base64-encoded signature image from canvas"
        consentGiven:
          type: boolean
          description: "Must be true — E-SIGN Act consent acknowledgment"
        signerName:
          type: string
          maxLength: 255
          minLength: 1
        signerTitle:
          type: string
          maxLength: 255

    # ── Admin Schemas ──────────────────────────

    SendInviteRequest:
      type: object
      properties:
        message:
          type: string
          maxLength: 500
          description: "Optional personal message included in the invite email"

    RejectCarrierRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          maxLength: 1000
          minLength: 1

    CarrierOnboardingDetail:
      type: object
      required: [carrier, session, vehicles, drivers, documents]
      properties:
        carrier:
          type: object
          description: "Full carrier record with all onboarding fields"
          additionalProperties: true
        session:
          $ref: '#/components/schemas/OnboardingSession'
        vehicles:
          type: array
          items:
            type: object
            additionalProperties: true
        drivers:
          type: array
          items:
            type: object
            additionalProperties: true
        documents:
          type: array
          items:
            $ref: '#/components/schemas/PortalDocument'
        costAnalysis:
          $ref: '#/components/schemas/CostAnalysisResult'
        lanePreferences:
          type: object
          properties:
            homeBaseCity:
              type: string
            homeBaseState:
              type: string
            maxDaysOut:
              type: integer
            preferredLanes:
              type: array
              items:
                $ref: '#/components/schemas/LanePreferenceEntry'
            statePreferences:
              type: array
              items:
                $ref: '#/components/schemas/StatePreferenceEntry'
            freightPreferences:
              type: array
              items:
                $ref: '#/components/schemas/FreightPreference'

    PendingCarrier:
      type: object
      required: [id, name, onboardingStatus, completedAt, entryMethod]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        type:
          $ref: '#/components/schemas/CarrierType'
        onboardingStatus:
          $ref: '#/components/schemas/OnboardingStatus'
        entryMethod:
          $ref: '#/components/schemas/EntryMethod'
        completedAt:
          type: string
          format: date-time
          nullable: true
        inviteSentAt:
          type: string
          format: date-time
          nullable: true
        driverCount:
          type: integer
        vehicleCount:
          type: integer

    PendingCarrierListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PendingCarrier'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    # ── Phase 2: Self-Registration ─────────────

    RegisterRequest:
      type: object
      required: [email, orgSlug]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        orgSlug:
          type: string
          maxLength: 100
          minLength: 1
          description: "Organization slug from branded URL (e.g., /onboarding/register?org=acme-dispatch)"

    VerifyRequest:
      type: object
      required: [email, code]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        code:
          type: string
          minLength: 6
          maxLength: 6
          pattern: "^[0-9]{6}$"

    VerifyResponse:
      type: object
      required: [token, carrierId]
      properties:
        token:
          type: string
          description: "Portal token for subsequent authenticated requests"
        carrierId:
          type: string
          format: uuid

    # ── Phase 2: FMCSA ────────────────────────

    FmcsaStatus:
      type: object
      properties:
        authorityStatus:
          $ref: '#/components/schemas/FmcsaAuthorityStatus'
        yearsActive:
          type: integer
          minimum: 0
          nullable: true
        safetyRating:
          $ref: '#/components/schemas/FmcsaSafetyRating'
        outOfServicePercent:
          type: number
          minimum: 0
          maximum: 100
          nullable: true
        crashCount:
          type: integer
          minimum: 0
          nullable: true
        lastCheckedAt:
          type: string
          format: date-time
          nullable: true
        suggestedTier:
          $ref: '#/components/schemas/TierClassification'

    SetTierRequest:
      type: object
      required: [tier]
      properties:
        tier:
          $ref: '#/components/schemas/TierClassification'

    # ── Phase 3: Settings ──────────────────────

    OnboardingSettingsUpdate:
      type: object
      properties:
        onboardingReminderDelays:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 720
          maxItems: 5
          description: "Hours after last activity for each reminder (e.g., [48, 120])"
        onboardingReminderMax:
          type: integer
          minimum: 0
          maximum: 10
          description: "Max reminders per carrier"
        documentExpiryWarningDays:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 90
          maxItems: 5
          description: "Days before expiry to send warnings (e.g., [30, 7])"

  # ─────────────────────────────────────────────
  # Parameters
  # ─────────────────────────────────────────────
  parameters:
    CarrierId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    DocumentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1

    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25

    SortParam:
      name: sort
      in: query
      schema:
        type: string
        default: createdAt

    OrderParam:
      name: order
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: desc

# ─────────────────────────────────────────────
# Paths
# ─────────────────────────────────────────────
paths:

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # CARRIER PORTAL (token-authenticated)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  /carrier-portal/session:
    get:
      operationId: getPortalSession
      summary: Get onboarding session and carrier summary
      description: Returns the current onboarding session with auto-saved step data and carrier info. Creates a new session if none exists.
      tags: [Carrier Portal]
      security:
        - portalToken: []
      responses:
        '200':
          description: Session and carrier summary
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PortalSessionResponse'
        '401':
          description: Missing, invalid, expired, or revoked portal token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /carrier-portal/session/answer:
    put:
      operationId: saveAnswer
      summary: Auto-save individual answer
      description: "Saves a single answer from the conversational interview. Debounced on client (500ms). Updates answers, currentPhase, currentQuestionIndex, and lastActiveAt."
      tags: [Carrier Portal]
      security:
        - portalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [questionId, value]
              properties:
                questionId:
                  type: string
                  maxLength: 100
                  description: "Unique question identifier from the declarative schema"
                value:
                  description: "Answer value — type varies by question (string, number, boolean, array, object)"
                phase:
                  type: integer
                  minimum: 1
                  maximum: 6
                  description: "Phase this question belongs to"
      responses:
        '200':
          description: Answer saved
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/OnboardingSession'
        '400':
          description: Invalid step number or malformed data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, invalid, expired, or revoked portal token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /carrier-portal/session/complete:
    post:
      operationId: completeSession
      summary: Mark onboarding session as complete
      description: |
        Validates all required steps are completed and all required documents are signed/uploaded.
        Sets completedAt, transitions onboardingStatus to COMPLETED, publishes carrier.onboarding.completed event.
      tags: [Carrier Portal]
      security:
        - portalToken: []
      responses:
        '200':
          description: Session marked complete, application submitted for review
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/OnboardingSession'
        '400':
          description: Not all required steps or documents are complete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, invalid, expired, or revoked portal token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Session already completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /carrier-portal/company:
    post:
      operationId: saveCompany
      summary: "Save Step 1 — Company information"
      description: Writes company data to the Carrier record. Fires carrier.fmcsa.lookup.requested if MC or DOT number is provided (Phase 2).
      tags: [Carrier Portal]
      security:
        - portalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveCompanyRequest'
      responses:
        '200':
          description: Company data saved to carrier
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/CarrierPortalSummary'
        '400':
          description: Invalid field values (e.g., bad MC# format, invalid email)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, invalid, expired, or revoked portal token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /carrier-portal/equipment:
    post:
      operationId: saveEquipment
      summary: "Save Step 2 — Equipment/vehicles"
      description: |
        Creates or replaces Vehicle records for the carrier. Validates per-category compliance rules:
        - SEMI_TRUCK: MC number must be on carrier
        - BOX_TRUCK: GVWR required; if > 26001 lbs, DOT number must be on carrier
        - CARGO_VAN: no additional compliance
        - PERSONAL_VEHICLE: deliveryTypes required
      tags: [Carrier Portal]
      security:
        - portalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveEquipmentRequest'
      responses:
        '200':
          description: Vehicles created/updated
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        category:
                          $ref: '#/components/schemas/VehicleCategory'
                        make:
                          type: string
                        model:
                          type: string
                        year:
                          type: integer
        '400':
          description: Validation failed — missing GVWR for box truck, missing MC for semi, etc.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, invalid, expired, or revoked portal token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /carrier-portal/drivers:
    post:
      operationId: saveDrivers
      summary: "Save Step 3 — Drivers"
      description: Creates or replaces Driver records for the carrier. If hasAdditionalDrivers is false, the drivers array is ignored and no additional drivers are created.
      tags: [Carrier Portal]
      security:
        - portalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveDriversRequest'
      responses:
        '200':
          description: Drivers created/updated
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        firstName:
                          type: string
                        lastName:
                          type: string
        '400':
          description: Invalid driver data (missing name, invalid pay rate)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, invalid, expired, or revoked portal token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /carrier-portal/cost-analysis:
    post:
      operationId: saveCostAnalysis
      summary: "Save Step 4 — Cost analysis"
      description: |
        Accepts 6 cost inputs, creates TruckExpense records, computes break-even RPM and minimum rate
        via calculateCpm + calculateMinBookRate. Writes minimumRatePerMile to Carrier record.
        Sets costProfileVersion=1 and costProfileSource='onboarding_estimate'.
      tags: [Carrier Portal]
      security:
        - portalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveCostAnalysisRequest'
      responses:
        '200':
          description: Cost analysis computed and saved
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/CostAnalysisResult'
        '400':
          description: Invalid cost inputs (negative values, zero MPG, etc.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, invalid, expired, or revoked portal token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /carrier-portal/lane-preferences:
    post:
      operationId: saveLanePreferences
      summary: "Save Step 5 — Lane preferences"
      description: Writes lane preference data to Driver records. All fields are optional — carrier may skip this step entirely.
      tags: [Carrier Portal]
      security:
        - portalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveLanePreferencesRequest'
      responses:
        '200':
          description: Lane preferences saved
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      saved:
                        type: boolean
        '400':
          description: Invalid state abbreviation or lane data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, invalid, expired, or revoked portal token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /carrier-portal/documents:
    get:
      operationId: listPortalDocuments
      summary: List carrier documents
      description: Returns all documents associated with this carrier's onboarding.
      tags: [Carrier Portal]
      security:
        - portalToken: []
      responses:
        '200':
          description: Document list
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PortalDocument'
        '401':
          description: Missing, invalid, expired, or revoked portal token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /carrier-portal/documents/presign:
    post:
      operationId: presignPortalDocument
      summary: Get presigned upload URL
      description: Creates a document record and returns a presigned S3 URL for upload.
      tags: [Carrier Portal]
      security:
        - portalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresignRequest'
      responses:
        '201':
          description: Presigned URL generated
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PresignResponse'
        '400':
          description: Invalid file name or content type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, invalid, expired, or revoked portal token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /carrier-portal/documents/{id}/confirm:
    post:
      operationId: confirmPortalDocument
      summary: Confirm document upload
      description: |
        Confirms that the file was uploaded to S3. Updates document status.
        For INSURANCE_CERT, requires insuranceExpiry and coverageConfirmed.
        Updates carrier compliance booleans (dispatchAgreementOnFile, insuranceCertOnFile, w9OnFile, carrierPacketOnFile).
      tags: [Carrier Portal]
      security:
        - portalToken: []
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmUploadRequest'
      responses:
        '200':
          description: Upload confirmed, compliance flags updated
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PortalDocument'
        '400':
          description: Missing insuranceExpiry for INSURANCE_CERT or coverageConfirmed not true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, invalid, expired, or revoked portal token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Document not found or does not belong to this carrier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /carrier-portal/documents/{id}/sign:
    post:
      operationId: signPortalDocument
      summary: Submit document signature
      description: |
        Stores base64 signature image on the document, records E-SIGN consent (IP + User-Agent)
        on the Carrier record. Sets signedAt timestamp. Updates dispatchAgreementOnFile = true.
      tags: [Carrier Portal]
      security:
        - portalToken: []
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignDocumentRequest'
      responses:
        '200':
          description: Signature stored, consent recorded
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PortalDocument'
        '400':
          description: Missing signature data, consentGiven is false, or missing signerName
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, invalid, expired, or revoked portal token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Document not found or does not belong to this carrier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # PHASE 2: SELF-REGISTRATION (public)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  /carrier-portal/register:
    post:
      operationId: registerCarrier
      summary: Start self-registration
      description: |
        Generates a 6-digit verification code and sends it to the provided email.
        Rate limited: max 3 codes per email per hour.
      tags: [Carrier Portal — Registration]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: Verification code sent to email
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [message]
                    properties:
                      message:
                        type: string
                        example: "Verification code sent"
        '400':
          description: Invalid email format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded — max 3 codes per email per hour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /carrier-portal/verify:
    post:
      operationId: verifyCarrierEmail
      summary: Verify email with 6-digit code
      description: |
        Validates the 6-digit code. On success: creates a DRAFT carrier record with
        entryMethod='SELF_REGISTER', creates a portal invite token, returns the token.
        Max 5 attempts per code. Code expires after 10 minutes.
      tags: [Carrier Portal — Registration]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRequest'
      responses:
        '200':
          description: Email verified, portal token returned
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/VerifyResponse'
        '400':
          description: Invalid or expired verification code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Max verification attempts exceeded (5)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /carrier-portal/fmcsa-status:
    get:
      operationId: getPortalFmcsaStatus
      summary: Get FMCSA verification status
      description: Returns cached FMCSA data for this carrier, if available. Returns null fields if FMCSA lookup has not completed yet.
      tags: [Carrier Portal]
      security:
        - portalToken: []
      responses:
        '200':
          description: FMCSA status
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/FmcsaStatus'
        '401':
          description: Missing, invalid, expired, or revoked portal token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # ADMIN ENDPOINTS (cookie-authenticated)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  /carriers/{id}/invite:
    post:
      operationId: sendInvite
      summary: Send onboarding invite to carrier
      description: |
        Generates a crypto-random 32-byte token with 7-day expiry. Sends email + SMS to carrier.
        Sets carrier onboardingStatus to NOT_STARTED and inviteSentAt. Publishes carrier.invited event.
        Carrier must have an email address.
      tags: [Carrier Admin]
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CarrierId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendInviteRequest'
      responses:
        '200':
          description: Invite sent successfully
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [inviteSentAt]
                    properties:
                      inviteSentAt:
                        type: string
                        format: date-time
                      tokenExpiresAt:
                        type: string
                        format: date-time
        '400':
          description: Carrier has no email address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: User does not have ADMIN or DISPATCHER role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Carrier not found in this organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Carrier already has ACTIVE status or onboarding is already COMPLETED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /carriers/{id}/resend-invite:
    post:
      operationId: resendInvite
      summary: Resend onboarding invite (revokes old token)
      description: Revokes any existing invite token for this carrier and generates a new one. Sends email + SMS.
      tags: [Carrier Admin]
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CarrierId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendInviteRequest'
      responses:
        '200':
          description: New invite sent, old token revoked
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [inviteSentAt]
                    properties:
                      inviteSentAt:
                        type: string
                        format: date-time
                      tokenExpiresAt:
                        type: string
                        format: date-time
        '400':
          description: Carrier has no email address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: User does not have ADMIN or DISPATCHER role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Carrier not found in this organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /carriers/{id}/approve:
    post:
      operationId: approveCarrier
      summary: Approve carrier onboarding
      description: |
        Sets carrier status=ACTIVE, onboardingStatus=APPROVED. Activates minimumRatePerMile in Load Intelligence.
        Publishes carrier.onboarding.approved event. Sends activation email + SMS to carrier.
      tags: [Carrier Admin]
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CarrierId'
      responses:
        '200':
          description: Carrier approved and activated
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id, status, onboardingStatus]
                    properties:
                      id:
                        type: string
                        format: uuid
                      status:
                        $ref: '#/components/schemas/CarrierStatus'
                      onboardingStatus:
                        $ref: '#/components/schemas/OnboardingStatus'
                      minimumRatePerMile:
                        type: number
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: User does not have ADMIN or DISPATCHER role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Carrier not found in this organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Carrier onboardingStatus is not COMPLETED (cannot approve)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /carriers/{id}/reject:
    post:
      operationId: rejectCarrier
      summary: Reject carrier onboarding
      description: |
        Sets onboardingStatus=REJECTED. Requires a reason. Publishes carrier.onboarding.rejected event.
        Sends rejection email + SMS to carrier with reason.
      tags: [Carrier Admin]
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CarrierId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectCarrierRequest'
      responses:
        '200':
          description: Carrier rejected
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id, onboardingStatus]
                    properties:
                      id:
                        type: string
                        format: uuid
                      onboardingStatus:
                        $ref: '#/components/schemas/OnboardingStatus'
        '400':
          description: Rejection reason is empty
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: User does not have ADMIN or DISPATCHER role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Carrier not found in this organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Carrier onboardingStatus is not COMPLETED (cannot reject)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /carriers/{id}/onboarding:
    get:
      operationId: getCarrierOnboarding
      summary: Get full onboarding detail for approval gate
      description: Returns the complete onboarding session data, all submitted carrier/vehicle/driver data, documents, cost analysis, and lane preferences.
      tags: [Carrier Admin]
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CarrierId'
      responses:
        '200':
          description: Full onboarding detail
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/CarrierOnboardingDetail'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Carrier not found or no onboarding session exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /carriers/{id}/set-tier:
    post:
      operationId: setCarrierTier
      summary: Set tier classification (Phase 2)
      description: Sets the tier classification on the carrier. Typically called as part of the approval flow after reviewing FMCSA data.
      tags: [Carrier Admin]
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CarrierId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetTierRequest'
      responses:
        '200':
          description: Tier set
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id, tierClassification]
                    properties:
                      id:
                        type: string
                        format: uuid
                      tierClassification:
                        $ref: '#/components/schemas/TierClassification'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: User does not have ADMIN or DISPATCHER role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Carrier not found in this organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /carriers/{id}/fmcsa-refresh:
    post:
      operationId: refreshFmcsa
      summary: Trigger fresh FMCSA lookup (Phase 2)
      description: Fires a carrier.fmcsa.lookup.requested event to refresh FMCSA data. Returns immediately — results are async.
      tags: [Carrier Admin]
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CarrierId'
      responses:
        '202':
          description: FMCSA refresh requested (async)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [message]
                    properties:
                      message:
                        type: string
                        example: "FMCSA lookup requested"
        '400':
          description: Carrier has no MC or DOT number
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: User does not have ADMIN or DISPATCHER role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Carrier not found in this organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /dashboard/pending-carriers:
    get:
      operationId: listPendingCarriers
      summary: List carriers pending approval
      description: Returns carriers with onboardingStatus=COMPLETED, ordered by completedAt descending. Used for the dashboard pending queue.
      tags: [Dashboard]
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Pending carriers list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingCarrierListResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

