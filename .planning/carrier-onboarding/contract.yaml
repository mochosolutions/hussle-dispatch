# ─────────────────────────────────────────────
# Data Flow Maps
# ─────────────────────────────────────────────
x-data-flow:
  "Send Onboarding Invite":
    trigger: "Dispatcher clicks 'Send Onboarding Invite' on carrier detail page"
    steps:
      - "Frontend: POST /carriers/{id}/invite with optional message"
      - "Backend: carrierService.sendInvite() validates carrier has email, is not ACTIVE"
      - "Backend: carrierInviteTokenRepo.create() generates crypto-random 32-byte token, 7-day expiry"
      - "Backend: carrier.update({ onboardingStatus: NOT_STARTED, inviteSentAt: now, entryMethod: INVITE })"
      - "Backend: eventBus.publish('carrier.invited', { carrierId, token, ... })"
      - "Backend: returns 200 with inviteSentAt"
      - "Subscriber: carrier.invited → emailService sends CarrierInviteEmail with portal link"
      - "Subscriber: carrier.invited → smsService sends invite SMS with portal link"
      - "Frontend: shows success toast, updates carrier detail"
    services: [dispatch-ui, dispatch-api, emails]

  "Carrier Opens Portal":
    trigger: "Carrier clicks invite link in email/SMS"
    steps:
      - "Frontend: loads /carrier-portal/:token route"
      - "Frontend: GET /carrier-portal/session with Bearer token"
      - "Backend: authenticateCarrierToken middleware validates token (exists, not expired, not revoked)"
      - "Backend: onboardingSessionService.getOrCreate(carrierId) returns or creates session"
      - "Backend: returns 200 with session + carrier summary"
      - "Frontend: renders conversational interview at session.currentPhase with saved answers"
    services: [dispatch-ui, dispatch-api]

  "Auto-Save Answer":
    trigger: "Carrier answers a question in the conversational interview"
    steps:
      - "Frontend: PUT /carrier-portal/session/answer with { questionId, value, phase }"
      - "Backend: session.answers[questionId] = value, session.currentPhase/currentQuestionIndex updated"
      - "Backend: session.lastActiveAt = now"
      - "Backend: returns 200 with updated session"
    services: [dispatch-ui, dispatch-api]

  "Complete Step 1 (Company)":
    trigger: "Carrier fills company form and clicks Next"
    steps:
      - "Frontend: POST /carrier-portal/company with form data"
      - "Backend: validates input (Yup schema)"
      - "Backend: carrier.update({ name, mcNumber, dotNumber, ein, ... })"
      - "Backend (Phase 2): if mcNumber or dotNumber provided, eventBus.publish('carrier.fmcsa.lookup.requested')"
      - "Backend: returns 200 with carrier summary"
      - "Frontend: auto-saves step data, advances to Step 2"
    services: [dispatch-ui, dispatch-api]

  "Complete Step 2 (Equipment)":
    trigger: "Carrier adds vehicles and clicks Next"
    steps:
      - "Frontend: POST /carrier-portal/equipment with vehicles array"
      - "Backend: validates per-category compliance (GVWR for box trucks, MC for semis, etc.)"
      - "Backend: vehicleRepo.deleteByCarrierId() clears previous vehicles"
      - "Backend: vehicleRepo.createMany() creates new Vehicle records"
      - "Backend: returns 200 with created vehicles"
      - "Frontend: auto-saves step data, advances to Step 3"
    services: [dispatch-ui, dispatch-api]

  "Complete Step 4 (Cost Analysis)":
    trigger: "Carrier enters 6 cost inputs and submits"
    steps:
      - "Frontend: POST /carrier-portal/cost-analysis with 6 inputs"
      - "Backend: creates TruckExpense records from inputs"
      - "Backend: calculateCpm(expenses) → breakEvenRpm"
      - "Backend: calculateMinBookRate(breakEvenRpm) → minimumRatePerMile"
      - "Backend: carrier.update({ minimumRatePerMile, costProfileVersion: 1, costProfileSource: 'onboarding_estimate' })"
      - "Backend: returns 200 with CostAnalysisResult"
      - "Frontend: renders full-screen result card (navy bg, animated numbers)"
    services: [dispatch-ui, dispatch-api]

  "Complete Step 6 (Documents) — Sign Agreement":
    trigger: "Carrier draws signature, checks E-SIGN consent, clicks Submit"
    steps:
      - "Frontend: POST /carrier-portal/documents/{id}/sign with signatureData + consent"
      - "Backend: validates consentGiven === true"
      - "Backend: document.update({ signatureData, signedAt: now })"
      - "Backend: carrier.update({ dispatchAgreementOnFile: true, dispatchAgreementConsentIp: req.ip, dispatchAgreementConsentUserAgent: req.headers['user-agent'], dispatchAgreementSignedAt: now })"
      - "Backend: returns 200 with updated document"
    services: [dispatch-ui, dispatch-api]

  "Complete Step 6 (Documents) — Upload COI":
    trigger: "Carrier drags file into upload zone"
    steps:
      - "Frontend: POST /carrier-portal/documents/presign with { fileName, contentType, documentType: INSURANCE_CERT }"
      - "Backend: documentService.presign() creates Document record, generates S3 presigned URL"
      - "Backend: returns 201 with { documentId, uploadUrl, fields }"
      - "Frontend: uploads file directly to S3 using presigned URL"
      - "Frontend: POST /carrier-portal/documents/{id}/confirm with { documentType: INSURANCE_CERT, insuranceExpiry, coverageConfirmed: true }"
      - "Backend: document.update({ status: 'uploaded' }); carrier.update({ insuranceCertOnFile: true, insuranceExpiry })"
      - "Backend: returns 200 with updated document"
    services: [dispatch-ui, dispatch-api, S3]

  "Submit Onboarding Application":
    trigger: "Carrier clicks Submit on final step"
    steps:
      - "Frontend: POST /carrier-portal/session/complete"
      - "Backend: validates all 6 steps completed, all 4 documents signed/uploaded"
      - "Backend: session.update({ completedAt: now })"
      - "Backend: carrier.update({ onboardingStatus: COMPLETED })"
      - "Backend: eventBus.publish('carrier.onboarding.completed', { carrierId, ... })"
      - "Backend: returns 200 with updated session"
      - "Subscriber: carrier.onboarding.completed → emails dispatcher (CarrierOnboardingCompleteEmail)"
      - "Frontend: shows completion screen ('Application under review')"
    services: [dispatch-ui, dispatch-api, emails]

  "Dispatcher Approves Carrier":
    trigger: "Dispatcher clicks Approve in approval gate"
    steps:
      - "Frontend: POST /carriers/{id}/approve"
      - "Backend: validates onboardingStatus === COMPLETED"
      - "Backend: carrier.update({ status: ACTIVE, onboardingStatus: APPROVED })"
      - "Backend: eventBus.publish('carrier.onboarding.approved', { carrierId, minimumRatePerMile, ... })"
      - "Backend: returns 200 with { id, status, onboardingStatus, minimumRatePerMile }"
      - "Subscriber: carrier.onboarding.approved → emailService sends CarrierApprovedEmail"
      - "Subscriber: carrier.onboarding.approved → smsService sends activation SMS"
      - "Frontend: shows success, navigates to carrier detail"
      - "Load Intelligence: scoreFleetUnit now includes carrier's minimumRatePerMile"
    services: [dispatch-ui, dispatch-api, emails]

  "Dispatcher Rejects Carrier":
    trigger: "Dispatcher clicks Reject, enters reason, confirms"
    steps:
      - "Frontend: POST /carriers/{id}/reject with { reason }"
      - "Backend: validates onboardingStatus === COMPLETED, reason not empty"
      - "Backend: carrier.update({ onboardingStatus: REJECTED })"
      - "Backend: eventBus.publish('carrier.onboarding.rejected', { carrierId, rejectionReason, ... })"
      - "Backend: returns 200 with { id, onboardingStatus }"
      - "Subscriber: carrier.onboarding.rejected → emailService sends CarrierRejectedEmail with reason"
      - "Subscriber: carrier.onboarding.rejected → smsService sends rejection SMS"
      - "Frontend: shows confirmation, updates carrier detail"
    services: [dispatch-ui, dispatch-api, emails]

  "Self-Registration (Phase 2)":
    trigger: "Carrier visits /onboarding/register and enters email"
    steps:
      - "Frontend: POST /carrier-portal/register with { email }"
      - "Backend: validates email, checks rate limit (3 per email per hour)"
      - "Backend: generates 6-digit code, stores EmailVerificationToken (10-min expiry)"
      - "Backend: emailService sends CarrierVerificationCodeEmail"
      - "Backend: returns 200 with { message: 'Verification code sent' }"
      - "Frontend: shows 6-digit code entry screen"
      - "Frontend: POST /carrier-portal/verify with { email, code }"
      - "Backend: validates code (max 5 attempts, checks expiry)"
      - "Backend: creates DRAFT Carrier with entryMethod=SELF_REGISTER"
      - "Backend: creates CarrierInviteToken for the new carrier"
      - "Backend: eventBus.publish('carrier.self.registered')"
      - "Backend: returns 200 with { token, carrierId }"
      - "Subscriber: carrier.self.registered → emails dispatcher (SelfRegistrationNotificationEmail)"
      - "Frontend: redirects to /carrier-portal/:token (same conversational interview)"
    services: [dispatch-ui, dispatch-api, emails]

  "FMCSA Lookup (Phase 2)":
    trigger: "carrier.fmcsa.lookup.requested event fires (after Step 1 save with MC/DOT)"
    steps:
      - "Subscriber: receives event with { carrierId, mcNumber, dotNumber }"
      - "Backend: fmcsaService.lookup(mcNumber, dotNumber) calls FMCSA SAFER API"
      - "Backend: carrier.update({ fmcsaAuthorityStatus, fmcsaYearsActive, fmcsaSafetyRating, fmcsaOutOfServicePercent, fmcsaCrashCount, fmcsaLastCheckedAt, fmcsaRawData })"
      - "Backend: eventBus.publish('carrier.fmcsa.verified', { carrierId, authorityStatus, safetyRating, yearsActive })"
    services: [dispatch-api, FMCSA SAFER API]

  "Onboarding Reminder (Phase 3)":
    trigger: "Scheduled job runs every hour"
    steps:
      - "Backend: onboardingReminderService queries stale sessions (not completed, lastActiveAt older than configured delay, remindersSent < max)"
      - "Backend: for each stale session, sends OnboardingReminderEmail + SMS with resume link"
      - "Backend: session.update({ remindersSent: +1, lastReminderAt: now })"
      - "Backend: eventBus.publish('carrier.onboarding.reminder.sent')"
    services: [dispatch-api, emails]

  "Document Expiry Monitoring (Phase 3)":
    trigger: "Scheduled job runs daily"
    steps:
      - "Backend: documentExpiryService queries carriers where insuranceExpiry within warning window"
      - "Backend: checks documentExpiryWarningsSent to avoid duplicates"
      - "Backend: sends DocumentExpiryWarningEmail (30-day or 7-day) with re-upload link"
      - "Backend: carrier.update({ documentExpiryWarningsSent: { ...existing, [warningType]: now } })"
      - "Backend: if expired: carrier.update({ insuranceCertOnFile: false }), sends DocumentExpiredEmail"
      - "Backend: eventBus.publish('carrier.document.expiring')"
    services: [dispatch-api, emails]

  "Document Re-Upload (Phase 3)":
    trigger: "Carrier clicks re-upload link in expiry email"
    steps:
      - "Frontend: loads /carrier-portal/:token route (scoped to document upload)"
      - "Frontend: POST /carrier-portal/documents/presign with { fileName, contentType, documentType: INSURANCE_CERT }"
      - "Frontend: uploads file to S3"
      - "Frontend: POST /carrier-portal/documents/{id}/confirm with { insuranceExpiry, coverageConfirmed: true }"
      - "Backend: carrier.update({ insuranceCertOnFile: true, insuranceExpiry: newDate, documentExpiryWarningsSent: {} })"
    services: [dispatch-ui, dispatch-api, S3]

# ─────────────────────────────────────────────
