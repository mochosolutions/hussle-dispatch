x-auth-matrix:
  - endpoint: 'POST /api/v1/loads'
    roles: [ADMIN, DISPATCHER]
    scoping: 'organizationId from JWT claims; load is created under that org'
  - endpoint: 'GET /api/v1/loads/{id}'
    roles: [ADMIN, DISPATCHER, DRIVER, VIEWER]
    scoping: 'organizationId from JWT claims; row must match'
  - endpoint: 'PATCH /api/v1/loads/{id}'
    roles: [ADMIN, DISPATCHER]
    scoping: 'organizationId from JWT claims; row must match'
  - endpoint: 'POST /api/v1/loads/{loadId}/stops'
    roles: [ADMIN, DISPATCHER]
    scoping: 'organizationId from JWT claims; loadId must belong to that org'
  - endpoint: 'PATCH /api/v1/loads/{loadId}/stops/{stopId}'
    roles: [ADMIN, DISPATCHER]
    scoping: 'organizationId from JWT claims; loadId + stopId must belong to that org'
  - endpoint: 'GET /api/v1/places'
    roles: [ADMIN, DISPATCHER, DRIVER, VIEWER]
    scoping: 'organizationId from JWT claims'
  - endpoint: 'GET /api/v1/places/{id}'
    roles: [ADMIN, DISPATCHER, DRIVER, VIEWER]
    scoping: 'organizationId from JWT claims; row must match'
  - endpoint: 'POST /api/v1/places'
    roles: [ADMIN, DISPATCHER]
    scoping: 'organizationId from JWT claims; place created under that org with source=USER'
  - endpoint: 'PATCH /api/v1/places/{id}'
    roles: [ADMIN, DISPATCHER]
