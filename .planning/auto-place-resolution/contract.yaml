    roles: [ADMIN, DISPATCHER, VIEWER]
    scoping: 'organizationId from JWT claims'
  - endpoint: 'PUT /api/v1/settings'
    roles: [ADMIN]
    scoping: 'organizationId from JWT claims'

# -----------------------------------------------------------------------------
# Data flow maps for the major user actions in the plan
# -----------------------------------------------------------------------------
x-data-flow:
  'Create load with mixed saved + free-text stops (Flow A)':
    trigger: Dispatcher submits Create Load form
    steps:
      - 'Frontend: POST /api/v1/loads with stops[] (one has placeId, one has address only)'
      - 'Backend (createLoad service): for each stop calls resolveStopToPlace(stop, organizationId)'
      - 'Backend (resolveStopToPlace): explicit placeId → bypass; free-text → tier-1 dedupe lookup'
      - 'Backend: tier-1 miss → GeocodingProviderPort.geocode(structured) (AWS v2 GeocodeCommand)'
      - 'Backend: tier-2 dedupe lookup using AWS-canonical fields → miss → INSERT ... ON CONFLICT DO NOTHING'
      - 'Backend: stop saved with placeId + resolutionStatus=RESOLVED'
      - 'Backend: returns 201 { data: load, warnings: [] }'
      - 'Frontend: navigates to load detail; map renders both pins'
    services: [dispatch-ui, dispatch-api]
    endpoints: ['POST /api/v1/loads']

  'Create load with ambiguous address (Flow B)':
    trigger: Dispatcher submits a typo'd address
    steps:
      - 'Frontend: POST /api/v1/loads with free-text stop'
      - 'Backend: resolveStopToPlace tier-1 miss → AWS Geocode returns matchScore < 0.7'
      - 'Backend: rejects, stop saves with placeId=NULL and resolutionStatus=AMBIGUOUS'
      - 'Backend: returns 201 { data, warnings: [{ code: STOP_AMBIGUOUS_ADDRESS, stopSequence, message }] }'
      - 'Frontend: shows warning toast/banner; dispatcher edits stop'
      - 'Frontend: PATCH /api/v1/loads/{id}/stops/{stopId} → resolution succeeds → status flips to RESOLVED'
    services: [dispatch-ui, dispatch-api]
    endpoints:
      - 'POST /api/v1/loads'
      - 'PATCH /api/v1/loads/{loadId}/stops/{stopId}'

  'Geocoder unavailable (Flow C)':
    trigger: AWS Location Service is down at submit time
    steps:
      - 'Frontend: POST /api/v1/loads'
      - 'Backend: resolveStopToPlace catches SDK throw, logs, returns null result'
      - 'Backend: each affected stop saved with placeId=NULL and resolutionStatus=UNRESOLVED'
      - 'Backend: returns 201 { data, warnings: [GEOCODER_UNAVAILABLE per stop] }'
      - 'Frontend: load is usable; map pins absent until dispatcher re-edits stops post-recovery'
    services: [dispatch-ui, dispatch-api]
    endpoints: ['POST /api/v1/loads']

  'Soft-fill enrichment on Place match (Flow D)':
    trigger: Second stop at the same address is created with additional contact fields
    steps:
      - 'Frontend: POST /api/v1/loads (or PATCH stop) with contactName/contactPhone/notes'
      - 'Backend: resolveStopToPlace tier-1 dedupe matches existing Place P'
      - 'Backend: writes Stop fields into Place P only where Place fields are null'
      - 'Backend: source NOT flipped (server-internal write)'
      - 'Backend: stop saves with placeId=P.id and resolutionStatus=RESOLVED'
    services: [dispatch-api]
    endpoints:
      - 'POST /api/v1/loads'
      - 'POST /api/v1/loads/{loadId}/stops'
      - 'PATCH /api/v1/loads/{loadId}/stops/{stopId}'

  'Typeahead with HQ bias (Flow E)':
    trigger: Dispatcher types a single-word query in the address typeahead
    steps:
      - 'Frontend: GET /api/v1/places/address-search?query=walmart (no biasLat/biasLng)'
      - 'Backend: addressSearchService reads Organization.headquartersLat/Lng for the requesting org'
      - 'Backend: passes BiasPosition to AWS v2 SearchTextCommand (or US center fallback if null)'
      - 'Backend: returns merged saved + external results, ranked by proximity to bias'
      - 'Frontend: dropdown shows nearby Walmarts first'
    services: [dispatch-ui, dispatch-api]
    endpoints: ['GET /api/v1/places/address-search']

  'Concurrent novel-address creates (Flow F)':
    trigger: Two dispatchers create loads with the same novel pickup address simultaneously
    steps:
      - 'Both: POST /api/v1/loads → both miss tier-1, both call AWS Geocode'
      - 'Both: tier-2 miss → both attempt INSERT ... ON CONFLICT DO NOTHING'
      - 'One INSERT wins, one returns 0 rows'
      - 'Loser re-reads by canonical dedupe key, links to winner row'
      - 'Both loads return 201 with resolutionStatus=RESOLVED, single Place row exists'
    services: [dispatch-api]
    endpoints: ['POST /api/v1/loads']

  'Update place — AUTO → USER source flip':
    trigger: Admin edits an auto-generated Place in the Places admin UI
    steps:
      - 'Frontend: PATCH /api/v1/places/{id} with field changes'
      - 'Backend: updatePlace service detects source=AUTO + user-initiated context → flips to USER'
      - 'Backend: writes update + source flip in one transaction'
      - 'Backend: returns 200 { ...place, source: USER }'
    services: [dispatch-ui, dispatch-api]
    endpoints: ['PATCH /api/v1/places/{id}']

  'Set HQ bias coords':
    trigger: Admin sets organization headquarters on the settings page
    steps:
      - 'Frontend: PUT /api/v1/settings { headquartersLatitude, headquartersLongitude }'
      - 'Backend: settings service validates pair (both set or both null), writes to Organization row'
      - 'Backend: returns 200 with updated settings'
      - 'Subsequent address-search calls in this org use the new bias by default'
    services: [dispatch-ui, dispatch-api]
    endpoints:
      - 'PUT /api/v1/settings'
      - 'GET /api/v1/places/address-search'
