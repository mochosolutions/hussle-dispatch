openapi: 3.0.3
info:
  title: User Management API
  version: 1.0.0
  description: Endpoints for team member management, invitation flow, and subscription enforcement.

servers:
  - url: /api/v1

security:
  - bearerAuth: []

paths:
  /organizations/{organizationId}/members:
    get:
      operationId: listMembers
      summary: List active members in the organization
      tags: [Members]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: List of active members
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Member'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /organizations/{organizationId}/members/{membershipId}/role:
    patch:
      operationId: changeMemberRole
      summary: Change a member's role
      tags: [Members]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/MembershipId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeRoleRequest'
      responses:
        '200':
          description: Role updated
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Last admin conflict — cannot change the only admin's role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /organizations/{organizationId}/members/{membershipId}:
    delete:
      operationId: removeMember
      summary: Remove a member from the organization (soft delete + session revocation)
      tags: [Members]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/MembershipId'
      responses:
        '204':
          description: Member removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Last admin conflict — cannot remove the only admin, or cannot remove self
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /organizations/{organizationId}/subscription/usage:
    get:
      operationId: getSubscriptionUsage
      summary: Get current seat and vehicle counts vs plan limits
      tags: [Subscription]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Current usage and limits
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/SubscriptionUsage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /organizations/{organizationId}/invite:
    post:
      operationId: inviteUser
      summary: Invite a user to the organization (existing endpoint — extended with name fields)
      tags: [Invitations]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteUserRequest'
      responses:
        '201':
          description: Invitation created and email sent
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/InviteResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Email already invited or already a member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Seat limit reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LimitReachedError'

  /organizations/{organizationId}/invites:
    get:
      operationId: listInvitations
      summary: List pending invitations (existing endpoint — no changes)
      tags: [Invitations]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: List of pending invitations
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Invitation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /invitations/{token}/verify:
    post:
      operationId: verifyInvitation
      summary: Verify an invitation token (existing endpoint — no changes)
      tags: [Invitations]
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Token is valid
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/InvitationVerification'
        '400':
          description: Token expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Token not found or already used
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /invitations/accept:
    post:
      operationId: acceptInvitation
      summary: Accept invitation and create user account (existing endpoint — no changes)
      tags: [Invitations]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvitationRequest'
      responses:
        '201':
          description: Account created and membership activated
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [message]
                    properties:
                      message:
                        type: string
                        example: Account created successfully. Please log in.
        '400':
          description: Validation error or token expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Token not found or already used
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token via httpOnly cookie (sent automatically with withCredentials)

  parameters:
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    MembershipId:
      name: membershipId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    Member:
      type: object
      required: [id, userId, role, status, createdAt, user]
      properties:
        id:
          type: string
          format: uuid
          description: Membership ID
        userId:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/Role'
        status:
          type: string
          enum: [active]
        createdAt:
          type: string
          format: date-time
        user:
          type: object
          required: [id, firstName, lastName, email]
          properties:
            id:
              type: string
              format: uuid
            firstName:
              type: string
            lastName:
              type: string
            email:
              type: string
              format: email

    ChangeRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/Role'

    InviteUserRequest:
      type: object
      required: [firstName, lastName, email, role]
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 50
        lastName:
          type: string
          minLength: 1
          maxLength: 50
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'

    InviteResult:
      type: object
      required: [invited, skipped, invites]
      properties:
        invited:
          type: array
          items:
            type: string
            format: email
        skipped:
          type: array
          items:
            type: object
            required: [email, reason]
            properties:
              email:
                type: string
                format: email
              reason:
                type: string
        invites:
          type: array
          items:
            $ref: '#/components/schemas/Invitation'

    Invitation:
      type: object
      required: [id, email, role, status, createdAt, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
        status:
          type: string
          enum: [PENDING, ACCEPTED, EXPIRED, REVOKED]
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time

    InvitationVerification:
      type: object
      required: [email, role, organizationName, firstName, lastName]
      properties:
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
        firstName:
          type: string
        lastName:
          type: string
        organizationName:
          type: string

    AcceptInvitationRequest:
      type: object
      required: [invitationToken, email, password, firstName, lastName, role, organizationId]
      properties:
        invitationToken:
          type: string
          minLength: 10
          maxLength: 256
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 128
        firstName:
          type: string
          minLength: 1
          maxLength: 50
        lastName:
          type: string
          minLength: 1
          maxLength: 50
        role:
          type: string
          minLength: 1
          maxLength: 50
        organizationId:
          type: string
          format: uuid

    SubscriptionUsage:
      type: object
      required: [users, vehicles]
      properties:
        users:
          $ref: '#/components/schemas/UsageEntry'
        vehicles:
          $ref: '#/components/schemas/UsageEntry'

    UsageEntry:
      type: object
      required: [current, limit]
      properties:
        current:
          type: integer
          example: 2
        limit:
          type: integer
          example: 3

    LimitReachedError:
      type: object
      required: [errors, resourceType, limit]
      properties:
        errors:
          type: array
          items:
            type: object
            required: [message]
            properties:
              message:
                type: string
        resourceType:
          type: string
          enum: [users, vehicles]
        limit:
          type: integer

    Role:
      type: string
      enum: [admin, dispatcher, viewer, driver]

    ErrorResponse:
      type: object
      required: [errors]
      properties:
        errors:
          type: array
          items:
            type: object
            required: [message]
            properties:
              message:
                type: string
              field:
                type: string

  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Not authenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Not authorized (not an admin)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
