openapi: 3.0.3
info:
  title: Fleet Management API
  version: 1.0.0
  description: |
    Carriers, Drivers, Vehicles, and Contacts CRUD for hussle-app-dispatch.
    All endpoints require Bearer authentication. Organization scope is resolved
    from the auth token (req.organizationId) — not from URL params.

servers:
  - url: http://localhost:3001/api/v1
    description: Development

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    page:
      name: page
      in: query
      description: Page number (1-based)
      schema:
        type: integer
        default: 1
        minimum: 1
    limit:
      name: limit
      in: query
      description: Items per page (max 100)
      schema:
        type: integer
        default: 25
        minimum: 1
        maximum: 100
    sort:
      name: sort
      in: query
      description: Field to sort by
      schema:
        type: string
        default: createdAt
    order:
      name: order
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: desc
    search:
      name: search
      in: query
      description: Full-text search across key string fields
      schema:
        type: string

  schemas:

    # ─── Shared ─────────────────────────────────────────────────────────────

    PaginationMeta:
      type: object
      required: [page, limit, total, totalPages, hasMore]
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
        hasMore:
          type: boolean

    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true

    ConflictErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, blockingLoadIds]
          properties:
            code:
              type: string
              example: ACTIVE_LOADS
            message:
              type: string
            blockingLoadIds:
              type: array
              items:
                type: string
                format: uuid

    # ─── Enums ───────────────────────────────────────────────────────────────

    CarrierType:
      type: string
      enum: [COMPANY_ASSET, EXTERNAL_CARRIER]
      description: >
        OWNER_OPERATOR is present in the data model but rejected at the API
        layer with 400 and message "Owner-operator support coming soon".

    InsuranceWarning:
      type: string
      enum: ['30_DAY', '7_DAY', EXPIRED]
      nullable: true
      description: >
        Present on carriers with upcoming or expired insurance.
        30_DAY = expiry within 30 days, 7_DAY = within 7 days, EXPIRED = past expiry.

    EquipmentType:
      type: string
      enum: [DRY_VAN, REEFER, FLATBED, STEP_DECK, BOX_TRUCK, HOTSHOT, POWER_ONLY]

    VehicleOwnership:
      type: string
      enum: [OWNED, LEASED]

    ExpenseCategory:
      type: string
      enum: [FIXED, VARIABLE, SERVICE, WAGE, DEDUCTION]

    ContactType:
      type: string
      enum: [BROKER, SHIPPER, CONSIGNEE, FACTORING]

    # ─── Carrier ─────────────────────────────────────────────────────────────

    Carrier:
      type: object
      required:
        - id
        - name
        - type
        - dispatchFeePercent
        - feeIncludesAccessorials
        - dispatchAgreementOnFile
        - insuranceCertOnFile
        - w9OnFile
        - carrierPacketOnFile
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          $ref: '#/components/schemas/CarrierType'
        mcNumber:
          type: string
          nullable: true
        dotNumber:
          type: string
          nullable: true
        ein:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        address:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        zip:
          type: string
          nullable: true
        dispatchFeePercent:
          type: string
          description: Decimal serialized as string (e.g. "10.00"). Default 10.
        partnerSplitPercent:
          type: string
          description: >
            Decimal serialized as string. Default 50.
            OMITTED from responses for DISPATCHER role (role matrix L-012).
          nullable: true
        feeIncludesAccessorials:
          type: boolean
          default: false
        dispatchAgreementOnFile:
          type: boolean
        insuranceCertOnFile:
          type: boolean
        w9OnFile:
          type: boolean
        carrierPacketOnFile:
          type: boolean
        insuranceExpiry:
          type: string
          format: date
          nullable: true
        insuranceWarning:
          $ref: '#/components/schemas/InsuranceWarning'
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true

    CarrierListItem:
      description: Carrier with computed counts and onboarding status for list views.
      allOf:
        - $ref: '#/components/schemas/Carrier'
        - type: object
          required: [driverCount, vehicleCount, onboardingComplete]
          properties:
            driverCount:
              type: integer
            vehicleCount:
              type: integer
            onboardingComplete:
              type: boolean
              description: >
                True when all 3 required onboarding booleans are set and
                insurance is not expired. Always true for COMPANY_ASSET.

    CreateCarrierRequest:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        type:
          $ref: '#/components/schemas/CarrierType'
        mcNumber:
          type: string
        dotNumber:
          type: string
        ein:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        address:
          type: string
        city:
          type: string
        state:
          type: string
        zip:
          type: string
        dispatchFeePercent:
          type: number
          default: 10
        partnerSplitPercent:
          type: number
          default: 50
        feeIncludesAccessorials:
          type: boolean
          default: false
        dispatchAgreementOnFile:
          type: boolean
          default: false
        insuranceCertOnFile:
          type: boolean
          default: false
        w9OnFile:
          type: boolean
          default: false
        carrierPacketOnFile:
          type: boolean
          default: false
        insuranceExpiry:
          type: string
          format: date
          nullable: true
        notes:
          type: string

    UpdateCarrierRequest:
      type: object
      description: All fields optional. Type cannot be changed after creation.
      properties:
        name:
          type: string
        mcNumber:
          type: string
        dotNumber:
          type: string
        ein:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        address:
          type: string
        city:
          type: string
        state:
          type: string
        zip:
          type: string
        dispatchFeePercent:
          type: number
        partnerSplitPercent:
          type: number
        feeIncludesAccessorials:
          type: boolean
        dispatchAgreementOnFile:
          type: boolean
        insuranceCertOnFile:
          type: boolean
        w9OnFile:
          type: boolean
        carrierPacketOnFile:
          type: boolean
        insuranceExpiry:
          type: string
          format: date
          nullable: true
        notes:
          type: string

    OnboardingStatus:
      type: object
      required: [allowed, missingDocuments]
      properties:
        allowed:
          type: boolean
        missingDocuments:
          type: array
          items:
            type: string
          example: ['Signed Dispatch Agreement', 'W-9']

    # ─── Driver ──────────────────────────────────────────────────────────────

    PreferredLane:
      type: object
      required: [originState, destState]
      properties:
        originState:
          type: string
          minLength: 2
          maxLength: 2
          description: 2-letter US state abbreviation
        destState:
          type: string
          minLength: 2
          maxLength: 2
        originCity:
          type: string
          nullable: true
        destCity:
          type: string
          nullable: true

    NoGoZone:
      type: object
      required: [state]
      properties:
        state:
          type: string
          minLength: 2
          maxLength: 2
          description: 2-letter US state abbreviation
        city:
          type: string
          nullable: true

    Driver:
      type: object
      required:
        - id
        - carrierId
        - name
        - maxDaysOut
        - isAvailable
        - preferredLanes
        - noGoZones
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        carrierId:
          type: string
          format: uuid
        name:
          type: string
        phone:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        cdlNumber:
          type: string
          nullable: true
        cdlState:
          type: string
          nullable: true
        cdlExpiry:
          type: string
          format: date
          nullable: true
        availableHours:
          type: string
          description: Decimal serialized as string. Represents hours available in the current week.
          nullable: true
        currentCity:
          type: string
          nullable: true
        currentState:
          type: string
          nullable: true
        homeBaseCity:
          type: string
          nullable: true
        homeBaseState:
          type: string
          nullable: true
        maxDaysOut:
          type: integer
          default: 5
        preferredLanes:
          type: array
          items:
            $ref: '#/components/schemas/PreferredLane'
        noGoZones:
          type: array
          items:
            $ref: '#/components/schemas/NoGoZone'
        isAvailable:
          type: boolean
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true

    CreateDriverRequest:
      type: object
      required: [carrierId, name]
      properties:
        carrierId:
          type: string
          format: uuid
        name:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        cdlNumber:
          type: string
        cdlState:
          type: string
        cdlExpiry:
          type: string
          format: date
          nullable: true
        availableHours:
          type: number
        currentCity:
          type: string
        currentState:
          type: string
        homeBaseCity:
          type: string
        homeBaseState:
          type: string
        maxDaysOut:
          type: integer
          default: 5
        preferredLanes:
          type: array
          items:
            $ref: '#/components/schemas/PreferredLane'
          default: []
        noGoZones:
          type: array
          items:
            $ref: '#/components/schemas/NoGoZone'
          default: []
        isAvailable:
          type: boolean
          default: true
        notes:
          type: string

    UpdateDriverRequest:
      type: object
      description: All fields optional. carrierId cannot be changed.
      properties:
        name:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        cdlNumber:
          type: string
        cdlState:
          type: string
        cdlExpiry:
          type: string
          format: date
          nullable: true
        availableHours:
          type: number
        currentCity:
          type: string
        currentState:
          type: string
        homeBaseCity:
          type: string
        homeBaseState:
          type: string
        maxDaysOut:
          type: integer
          minimum: 1
          maximum: 14
        preferredLanes:
          type: array
          items:
            $ref: '#/components/schemas/PreferredLane'
        noGoZones:
          type: array
          items:
            $ref: '#/components/schemas/NoGoZone'
        isAvailable:
          type: boolean
        notes:
          type: string

    # ─── Vehicle ─────────────────────────────────────────────────────────────

    TruckExpense:
      type: object
      required: [id, vehicleId, category, expenseKey, label, monthlyAmount]
      properties:
        id:
          type: string
          format: uuid
        vehicleId:
          type: string
          format: uuid
        category:
          $ref: '#/components/schemas/ExpenseCategory'
        expenseKey:
          type: string
          description: Unique per vehicle. Used to identify the expense row for replacement.
        label:
          type: string
        monthlyAmount:
          type: string
          description: Decimal serialized as string (e.g. "850.00"). Default "0.00".

    TruckExpenseInput:
      type: object
      required: [category, expenseKey, label]
      properties:
        category:
          $ref: '#/components/schemas/ExpenseCategory'
        expenseKey:
          type: string
        label:
          type: string
        monthlyAmount:
          type: number
          default: 0

    VehicleListItem:
      description: Vehicle summary for list views — expenses excluded (fetch via GET /vehicles/:vehicleId).
      type: object
      required:
        - id
        - carrierId
        - unitNumber
        - type
        - ownership
        - workingDaysPerMonth
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        carrierId:
          type: string
          format: uuid
        unitNumber:
          type: string
        type:
          $ref: '#/components/schemas/EquipmentType'
        ownership:
          $ref: '#/components/schemas/VehicleOwnership'
        year:
          type: integer
          nullable: true
        make:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
        vin:
          type: string
          nullable: true
        licensePlate:
          type: string
          nullable: true
        licensePlateState:
          type: string
          nullable: true
        emergencyContactName:
          type: string
          nullable: true
        emergencyContactPhone:
          type: string
          nullable: true
        warrantyInfo:
          type: string
          nullable: true
        monthlyGrossTarget:
          type: string
          description: Decimal serialized as string.
          nullable: true
        monthlyMilesTarget:
          type: integer
          nullable: true
        workingDaysPerMonth:
          type: integer
          default: 22
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true

    Vehicle:
      description: Full vehicle with expenses. Returned by GET /vehicles/:vehicleId and PATCH /vehicles/:vehicleId.
      type: object
      required:
        - id
        - carrierId
        - unitNumber
        - type
        - ownership
        - workingDaysPerMonth
        - expenses
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        carrierId:
          type: string
          format: uuid
        unitNumber:
          type: string
        type:
          $ref: '#/components/schemas/EquipmentType'
        ownership:
          $ref: '#/components/schemas/VehicleOwnership'
        year:
          type: integer
          nullable: true
        make:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
        vin:
          type: string
          nullable: true
        licensePlate:
          type: string
          nullable: true
        licensePlateState:
          type: string
          nullable: true
        emergencyContactName:
          type: string
          nullable: true
        emergencyContactPhone:
          type: string
          nullable: true
        warrantyInfo:
          type: string
          nullable: true
        monthlyGrossTarget:
          type: string
          description: Decimal serialized as string.
          nullable: true
        monthlyMilesTarget:
          type: integer
          nullable: true
        workingDaysPerMonth:
          type: integer
          default: 22
        notes:
          type: string
          nullable: true
        expenses:
          type: array
          items:
            $ref: '#/components/schemas/TruckExpense'
          description: All TruckExpense rows for this vehicle. Included in both list and detail responses.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true

    CreateVehicleRequest:
      type: object
      required: [carrierId, unitNumber, type]
      properties:
        carrierId:
          type: string
          format: uuid
        unitNumber:
          type: string
        type:
          $ref: '#/components/schemas/EquipmentType'
        ownership:
          $ref: '#/components/schemas/VehicleOwnership'
          # default: OWNED
        year:
          type: integer
        make:
          type: string
        model:
          type: string
        vin:
          type: string
        licensePlate:
          type: string
        licensePlateState:
          type: string
        emergencyContactName:
          type: string
        emergencyContactPhone:
          type: string
        warrantyInfo:
          type: string
        monthlyGrossTarget:
          type: number
        monthlyMilesTarget:
          type: integer
        workingDaysPerMonth:
          type: integer
          default: 22
        notes:
          type: string

    UpdateVehicleRequest:
      type: object
      description: All fields optional. carrierId cannot be changed.
      properties:
        unitNumber:
          type: string
        type:
          $ref: '#/components/schemas/EquipmentType'
        ownership:
          $ref: '#/components/schemas/VehicleOwnership'
        year:
          type: integer
        make:
          type: string
        model:
          type: string
        vin:
          type: string
        licensePlate:
          type: string
        licensePlateState:
          type: string
        emergencyContactName:
          type: string
        emergencyContactPhone:
          type: string
        warrantyInfo:
          type: string
        monthlyGrossTarget:
          type: number
        monthlyMilesTarget:
          type: integer
        workingDaysPerMonth:
          type: integer
        notes:
          type: string
        expenses:
          type: array
          items:
            $ref: '#/components/schemas/TruckExpenseInput'
          description: >
            When provided, replaces ALL existing TruckExpense rows in a
            single Prisma transaction (deleteMany + createMany).
            Duplicate expenseKeys in the same request → 400.

    # ─── Contact ─────────────────────────────────────────────────────────────

    Contact:
      type: object
      required:
        - id
        - organizationId
        - type
        - companyName
        - paymentTerms
        - paymentTermsDays
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/ContactType'
        companyName:
          type: string
        contactName:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        mcNumber:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        zip:
          type: string
          nullable: true
        paymentTerms:
          type: string
          default: net_30
          enum: [net_15, net_30, net_45, net_60]
        paymentTermsDays:
          type: integer
          default: 30
        quickPayDiscount:
          type: string
          description: Decimal serialized as string (e.g. "2.50" for 2.5%). Nullable.
          nullable: true
        carrierPacketSentAt:
          type: string
          format: date-time
          nullable: true
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true

    CreateContactRequest:
      type: object
      required: [type, companyName]
      properties:
        type:
          $ref: '#/components/schemas/ContactType'
        companyName:
          type: string
        contactName:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        mcNumber:
          type: string
        address:
          type: string
        city:
          type: string
        state:
          type: string
        zip:
          type: string
        paymentTerms:
          type: string
          enum: [net_15, net_30, net_45, net_60]
          default: net_30
        paymentTermsDays:
          type: integer
          default: 30
        quickPayDiscount:
          type: number
          nullable: true
        carrierPacketSentAt:
          type: string
          format: date-time
          nullable: true
        notes:
          type: string

    UpdateContactRequest:
      type: object
      description: All fields optional. type cannot be changed after creation.
      properties:
        companyName:
          type: string
        contactName:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        mcNumber:
          type: string
        address:
          type: string
        city:
          type: string
        state:
          type: string
        zip:
          type: string
        paymentTerms:
          type: string
          enum: [net_15, net_30, net_45, net_60]
        paymentTermsDays:
          type: integer
        quickPayDiscount:
          type: number
          nullable: true
        carrierPacketSentAt:
          type: string
          format: date-time
          nullable: true
        notes:
          type: string

# ─── Paths ───────────────────────────────────────────────────────────────────

paths:

  # ── Carriers ────────────────────────────────────────────────────────────────

  /carriers:
    get:
      summary: List carriers (paginated)
      operationId: listCarriers
      tags: [Carriers]
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/order'
        - $ref: '#/components/parameters/search'
          description: Matches name, mcNumber
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/CarrierType'
      responses:
        '200':
          description: Paginated carrier list with computed counts
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CarrierListItem'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

    post:
      summary: Create carrier
      operationId: createCarrier
      tags: [Carriers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCarrierRequest'
      responses:
        '201':
          description: Carrier created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Carrier'
        '400':
          description: Validation error or OWNER_OPERATOR type rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /carriers/{carrierId}:
    parameters:
      - name: carrierId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      summary: Get carrier by ID
      operationId: getCarrier
      tags: [Carriers]
      responses:
        '200':
          description: Carrier detail
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Carrier'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Carrier not found or soft-deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

    patch:
      summary: Update carrier
      operationId: updateCarrier
      tags: [Carriers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCarrierRequest'
      responses:
        '200':
          description: Updated carrier
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Carrier'
