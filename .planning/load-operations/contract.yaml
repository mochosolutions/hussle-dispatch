# =============================================================================
# Scheduling Type Validation Rules
# =============================================================================

x-validation-rules:
  scheduling-type-enforcement:
    description: |
      When a stop is created or updated (via load create/update or individual stop endpoints),
      validate required fields based on schedulingType. These are hard failures (400), not warnings.
    rules:
      - schedulingType: APPOINTMENT
        required: [appointmentStart]
        error: "Stop {sequence}: appointmentStart is required when schedulingType is APPOINTMENT"
      - schedulingType: NOTIFICATION
        required: [notificationHours]
        error: "Stop {sequence}: notificationHours is required when schedulingType is NOTIFICATION"
      - schedulingType: FCFS
        required: [targetDate]
        error: "Stop {sequence}: targetDate is required when schedulingType is FCFS"
      - schedulingType: OPEN
        required: []
      - schedulingType: DROP_HOOK
        required: []

  dispatch-gate:
    description: |
      When transitioning to DISPATCHED, check all stops on the load.
      Warnings are returned (422) but can be overridden.
    rules:
      - condition: "stop.schedulingType === APPOINTMENT AND stop.appointmentNumber is null/empty"
        warning:
          code: APPOINTMENT_NUMBER_MISSING
          message: "Stop {sequence}: APPOINTMENT stop is missing appointment number"

  detention-auto-detection:
    description: |
      When departureTime is set on a stop (via stop update or status transition side effect),
      check for detention eligibility.
    rules:
      - condition: "stop.type === DROP_HOOK"
        action: skip
      - condition: "stop.arrivalTime is null"
        action: skip
      - condition: "stop.departureTime is null"
        action: skip
      - calculation: |
          waitHours = (departureTime - arrivalTime) / 3600000
          freeHours = org.detentionFreeHours (default: 2)
          if waitHours > freeHours:
            billableHours = ceil(waitHours - freeHours)
            amount = billableHours * org.defaultDetentionRate
            create AccessorialCharge(type=DETENTION, amount, billTo='customer',
              approvalStatus=PENDING, isAutoGenerated=true, stopId=stop.id,
              description='Auto-detected: {waitHours}hr wait at {facilityName}')
            emit load.detention.detected event
      - duplicate-prevention: |
          Before creating, check: exists AccessorialCharge where
            loadId = load.id AND stopId = stop.id AND type = DETENTION AND isAutoGenerated = true
          If exists, skip creation.
