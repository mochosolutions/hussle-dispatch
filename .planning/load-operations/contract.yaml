openapi: 3.0.3
info:
  title: Load Operations — Scheduling Enforcement, Dispatch Gates & Detention
  version: 1.0.0
  description: |
    Behavioral enhancements to existing load endpoints. No new endpoints are introduced.
    This contract documents modified validation rules, new warning codes, detention
    auto-creation side effects, and a schema migration (stopId FK on AccessorialCharge).

# =============================================================================
# Auth Matrix
# =============================================================================

x-auth-matrix:
  - endpoint: "POST /api/v1/loads"
    roles: [admin, dispatcher]
    scoping: "organizationId from JWT claims"
    changes: "Enhanced stop validation — scheduling type field enforcement"

  - endpoint: "PATCH /api/v1/loads/{id}"
    roles: [admin, dispatcher]
    scoping: "organizationId from JWT claims"
    changes: "Enhanced stop validation — scheduling type field enforcement"

  - endpoint: "PATCH /api/v1/loads/{id}/status"
    roles: [admin, dispatcher]
    scoping: "organizationId from JWT claims"
    changes: "New DISPATCHED warning — APPOINTMENT stops missing appointmentNumber"

  - endpoint: "PATCH /api/v1/loads/{loadId}/stops/{stopId}"
    roles: [admin, dispatcher]
    scoping: "organizationId from JWT claims"
    changes: "Detention auto-detection when departureTime is set"

  - endpoint: "POST /api/v1/loads/{loadId}/stops"
    roles: [admin, dispatcher]
    scoping: "organizationId from JWT claims"
    changes: "Scheduling type field enforcement on individual stop create"

# =============================================================================
# Data Flow Map
# =============================================================================

x-data-flow:
  "Create Load with Scheduling Enforcement":
    trigger: "Dispatcher submits create load form with stops"
    steps:
      - "Frontend: POST /api/v1/loads with stops[] including schedulingType per stop"
      - "Backend: validateRequest(createLoadValidator) — Yup format validation"
      - "Backend: loadService.createLoad() calls validateStops()"
      - "Backend: validateStops() checks per-type field requirements:"
      - "  APPOINTMENT → appointmentStart required"
      - "  NOTIFICATION → notificationHours required"
      - "  FCFS → targetDate required"
      - "  OPEN / DROP_HOOK → no additional requirements"
      - "Backend: If missing fields → throw ValidationError(400) with stop sequence + field name"
      - "Backend: If valid → create load + stops + return 201"
    services: [dispatch-api]

  "Dispatch Gate — Transition to DISPATCHED":
    trigger: "Dispatcher moves load to DISPATCHED status"
    steps:
      - "Frontend: PATCH /api/v1/loads/{id}/status with { status: 'DISPATCHED' }"
      - "Backend: loadStatusService.transitionStatus() validates transition"
      - "Backend: validateTransition() checks load.stops for APPOINTMENT type"
      - "Backend: If any APPOINTMENT stop missing appointmentNumber → add warning"
      - "Backend: If warnings exist and overrideWarnings !== true → return 422 with warnings[]"
      - "Frontend: Show warning dialog to dispatcher with override option"
      - "Frontend: If override → retry with { status: 'DISPATCHED', overrideWarnings: true }"
      - "Backend: Transition proceeds, side effects execute, status history created"
      - "Backend: Return 200 with { success: true, load }"
    services: [dispatch-api, dispatch-ui]

  "Detention Auto-Detection — Stop Update Trigger":
    trigger: "Dispatcher or driver records departure time on a stop"
    steps:
      - "Frontend: PATCH /api/v1/loads/{loadId}/stops/{stopId} with { departureTime }"
      - "Backend: stopService.updateStop() updates the stop"
      - "Backend: If departureTime changed AND arrivalTime exists AND type !== DROP_HOOK:"
      - "  Calculate waitHours = (departureTime - arrivalTime) / 3600000"
      - "  Fetch org detentionFreeHours (default 2) and defaultDetentionRate"
      - "  If waitHours > freeHours:"
      - "    billableHours = ceil(waitHours - freeHours)"
      - "    amount = billableHours * defaultDetentionRate"
      - "    Create AccessorialCharge: type=DETENTION, approvalStatus=PENDING, isAutoGenerated=true, stopId=stop.id"
      - "    Emit domain event: load.detention.detected"
      - "Backend: Return 200 with updated stop"
      - "Backend: Notification subscriber sends detention alert to dispatcher"
    services: [dispatch-api]

  "Detention Safety Net — Status Transition":
    trigger: "Load transitions AT_PICKUP→IN_TRANSIT or AT_DELIVERY→DELIVERED"
    steps:
      - "Frontend: PATCH /api/v1/loads/{id}/status with { status: 'IN_TRANSIT' | 'DELIVERED' }"
      - "Backend: loadStatusService executes TRANSITION_SIDE_EFFECTS"
      - "Backend: CHECK_DETENTION side effect runs for relevant stops:"
      - "  AT_PICKUP→IN_TRANSIT: check all PICKUP stops"
      - "  AT_DELIVERY→DELIVERED: check all DELIVERY stops"
      - "Backend: For each stop with arrivalTime + departureTime and type !== DROP_HOOK:"
      - "  Skip if DETENTION accessorial with isAutoGenerated=true and stopId=stop.id already exists"
      - "  Otherwise run same detention calculation as stop update trigger"
      - "Backend: Return 200 with transition result"
    services: [dispatch-api]

# =============================================================================
# Paths — Modified Endpoints
# =============================================================================

paths:
  /api/v1/loads:
    post:
      summary: Create load (modified — scheduling type enforcement)
      description: |
        Existing endpoint with enhanced stop validation.
        Each stop's schedulingType now enforces required fields at creation time.
      tags: [Loads]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLoadRequest'
      responses:
        '201':
          description: Load created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleLoadResponse'
        '400':
          description: |
            Validation error. New scheduling-type-specific errors:
            - "Stop {sequence}: appointmentStart is required when schedulingType is APPOINTMENT"
            - "Stop {sequence}: notificationHours is required when schedulingType is NOTIFICATION"
            - "Stop {sequence}: targetDate is required when schedulingType is FCFS"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
        '403':
          description: User does not have admin or dispatcher role

  /api/v1/loads/{id}:
    patch:
      summary: Update load (modified — scheduling type enforcement)
      description: |
        Existing endpoint with enhanced stop validation when stops[] is provided.
        Same scheduling type field requirements as create.
      tags: [Loads]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LoadId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLoadRequest'
      responses:
        '200':
          description: Load updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleLoadResponse'
        '400':
          description: |
            Validation error including scheduling type field enforcement.
            Same error messages as create endpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
        '403':
          description: User does not have admin or dispatcher role
        '404':
          description: Load not found

  /api/v1/loads/{id}/status:
    patch:
      summary: Transition load status (modified — dispatch gate warning)
      description: |
        Existing endpoint with new warning for DISPATCHED transition.
        When transitioning to DISPATCHED, checks all APPOINTMENT-type stops
        for missing appointmentNumber. Returns 422 with warnings if found.
        Dispatcher can override with overrideWarnings: true.
      tags: [Loads, Status]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LoadId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionStatusRequest'
      responses:
        '200':
          description: Status transitioned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusTransitionResponse'
        '422':
          description: |
            Transition blocked by warnings (overrideable). New warning codes:
            - `APPOINTMENT_NUMBER_MISSING`: APPOINTMENT stop at sequence {n} has no appointment number.
            Existing warning codes:
            - `TRANSITION_WARNING`: Generic transition warning (e.g., missing signed BOL)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusTransitionResponse'
        '400':
          description: Invalid status value or missing required notes
        '401':
          description: Not authenticated
        '403':
          description: User does not have admin or dispatcher role
        '404':
          description: Load not found

  /api/v1/loads/{loadId}/stops/{stopId}:
    patch:
      summary: Update stop (modified — detention auto-detection)
      description: |
        Existing endpoint with detention auto-detection side effect.
        When departureTime is set and arrivalTime exists on the stop:
        - If stop type is DROP_HOOK, no detention check
        - Calculate wait time = departureTime - arrivalTime
        - If wait time > org detentionFreeHours:
          - Auto-create DETENTION AccessorialCharge (PENDING, isAutoGenerated)
          - Emit load.detention.detected domain event
          - Notify dispatcher
        Also enforces scheduling type field requirements on individual stop updates.
      tags: [Stops]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LoadIdParam'
        - $ref: '#/components/parameters/StopId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStopRequest'
      responses:
        '200':
          description: |
            Stop updated successfully. If detention was auto-detected,
            a DETENTION AccessorialCharge was created as a side effect
            (not included in this response — query load accessorials separately).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleStopResponse'
        '400':
          description: |
            Validation error. Includes scheduling type enforcement:
            - "appointmentStart is required when schedulingType is APPOINTMENT"
            - "notificationHours is required when schedulingType is NOTIFICATION"
            - "targetDate is required when schedulingType is FCFS"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
        '403':
          description: User does not have admin or dispatcher role
        '404':
          description: Load or stop not found

  /api/v1/loads/{loadId}/stops:
    post:
      summary: Create stop (modified — scheduling type enforcement)
      description: |
        Existing endpoint with scheduling type field enforcement.
        Same rules as load create/update stop validation.
      tags: [Stops]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LoadIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStopRequest'
      responses:
        '201':
          description: Stop created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleStopResponse'
        '400':
          description: Validation error including scheduling type field enforcement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
        '403':
          description: User does not have admin or dispatcher role
        '404':
          description: Load not found

# =============================================================================
# Components
# =============================================================================

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    LoadId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Load UUID

    LoadIdParam:
      name: loadId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Load UUID (parent resource)

    StopId:
      name: stopId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Stop UUID

  schemas:
    # ------------------------------------------------------------------
    # Enums
    # ------------------------------------------------------------------

    SchedulingType:
      type: string
      enum: [APPOINTMENT, FCFS, NOTIFICATION, OPEN, DROP_HOOK]
      x-display-names:
        APPOINTMENT: "Appointment"
        FCFS: "First Come First Served"
        NOTIFICATION: "Notification Required"
        OPEN: "Open"
        DROP_HOOK: "Drop & Hook"
      x-field-requirements:
        APPOINTMENT:
          required: [appointmentStart]
          recommended: [appointmentEnd, appointmentNumber]
        FCFS:
          required: [targetDate]
        NOTIFICATION:
          required: [notificationHours]
        OPEN:
          required: []
        DROP_HOOK:
          required: []

    StopType:
      type: string
      enum: [PICKUP, DELIVERY, STOP_OFF, DROP_HOOK, LIVE_UNLOAD]
      x-display-names:
        PICKUP: "Pickup"
        DELIVERY: "Delivery"
        STOP_OFF: "Stop Off"
        DROP_HOOK: "Drop & Hook"
        LIVE_UNLOAD: "Live Unload"

    LoadStatus:
      type: string
      enum: [QUOTED, BOOKED, DISPATCHED, EN_ROUTE_PICKUP, AT_PICKUP, IN_TRANSIT, AT_DELIVERY, DELIVERED, INVOICE_PENDING, INVOICED, PAID, EXCEPTION, CANCELED, TONU]
      x-display-names:
        QUOTED: "Quoted"
        BOOKED: "Booked"
        DISPATCHED: "Dispatched"
        EN_ROUTE_PICKUP: "En Route to Pickup"
        AT_PICKUP: "At Pickup"
        IN_TRANSIT: "In Transit"
        AT_DELIVERY: "At Delivery"
        DELIVERED: "Delivered"
        INVOICE_PENDING: "Invoice Pending"
        INVOICED: "Invoiced"
        PAID: "Paid"
        EXCEPTION: "Exception"
        CANCELED: "Canceled"
        TONU: "TONU"

    AccessorialType:
      type: string
      enum: [DETENTION, LUMPER, TONU, LAYOVER, DRIVER_ASSIST, FUEL_SURCHARGE, TARP, TOLL, OTHER]
      x-display-names:
        DETENTION: "Detention"
        LUMPER: "Lumper"
        TONU: "Truck Ordered Not Used"
        LAYOVER: "Layover"
        DRIVER_ASSIST: "Driver Assist"
        FUEL_SURCHARGE: "Fuel Surcharge"
        TARP: "Tarp"
        TOLL: "Toll"
        OTHER: "Other"

    ApprovalStatus:
      type: string
      enum: [NONE, PENDING, APPROVED, DISPUTED]
      x-display-names:
        NONE: "None"
        PENDING: "Pending Review"
        APPROVED: "Approved"
        DISPUTED: "Disputed"

    DispatchGateWarningCode:
      type: string
      enum: [APPOINTMENT_NUMBER_MISSING, TRANSITION_WARNING]
      description: Warning codes returned when transitioning to DISPATCHED
      x-display-names:
        APPOINTMENT_NUMBER_MISSING: "Appointment Number Missing"
        TRANSITION_WARNING: "Transition Warning"

    # ------------------------------------------------------------------
    # Stop schemas
    # ------------------------------------------------------------------

    StopInput:
      type: object
      required: [type, sequence]
      properties:
        type:
          $ref: '#/components/schemas/StopType'
        sequence:
          type: integer
          minimum: 0
        contactId:
          type: string
          format: uuid
        placeId:
          type: string
          format: uuid
        facilityName:
          type: string
          maxLength: 255
        address:
          type: string
          maxLength: 500
        city:
          type: string
          maxLength: 100
        state:
          type: string
          maxLength: 50
        zip:
          type: string
          maxLength: 20
        schedulingType:
          $ref: '#/components/schemas/SchedulingType'
        appointmentStart:
          type: string
          format: date-time
          nullable: true
          description: "Required when schedulingType is APPOINTMENT"
        appointmentEnd:
          type: string
          format: date-time
          nullable: true
        targetDate:
          type: string
          format: date-time
          nullable: true
          description: "Required when schedulingType is FCFS"
        notificationHours:
          type: integer
          minimum: 1
          maximum: 168
          nullable: true
          description: "Required when schedulingType is NOTIFICATION"
        appointmentNumber:
          type: string
          maxLength: 100
          description: "Facility confirmation number. Warned at DISPATCHED transition if missing on APPOINTMENT stops."
        contactName:
          type: string
          maxLength: 255
        contactPhone:
          type: string
          maxLength: 50
        commodity:
          type: string
          maxLength: 255
        weight:
          type: integer
          minimum: 0
        pieceCount:
          type: integer
          minimum: 0
        isHazmat:
          type: boolean
          default: false
        isTarp:
          type: boolean
          default: false
        isTempControlled:
          type: boolean
          default: false
        notes:
          type: string
          maxLength: 2000

    CreateStopRequest:
      allOf:
        - $ref: '#/components/schemas/StopInput'
        - type: object
          required: [type, facilityName, address, city, state, zip]

    UpdateStopRequest:
      type: object
      description: "All fields optional, but at least one must be provided. Scheduling type enforcement applies."
      properties:
        type:
          $ref: '#/components/schemas/StopType'
        sequence:
          type: integer
          minimum: 0
        facilityName:
          type: string
          maxLength: 255
        address:
          type: string
          maxLength: 500
        city:
          type: string
          maxLength: 100
        state:
          type: string
          maxLength: 50
        zip:
          type: string
          maxLength: 20
        schedulingType:
          $ref: '#/components/schemas/SchedulingType'
        appointmentStart:
          type: string
          format: date-time
          nullable: true
        appointmentEnd:
          type: string
          format: date-time
          nullable: true
        targetDate:
          type: string
          format: date-time
          nullable: true
        notificationHours:
          type: integer
          minimum: 1
          maximum: 168
          nullable: true
        appointmentNumber:
          type: string
          maxLength: 100
        arrivalTime:
          type: string
          format: date-time
          description: "Actual arrival time at the stop"
        departureTime:
          type: string
          format: date-time
          description: "Actual departure time. Setting this triggers detention auto-detection."
        contactName:
          type: string
          maxLength: 255
        contactPhone:
          type: string
          maxLength: 50
        commodity:
          type: string
          maxLength: 255
        weight:
          type: integer
          minimum: 0
        pieceCount:
          type: integer
          minimum: 0
        isHazmat:
          type: boolean
        isTarp:
          type: boolean
        isTempControlled:
          type: boolean
        notes:
          type: string
          maxLength: 2000

    # ------------------------------------------------------------------
    # Load schemas (subset — only fields relevant to this contract)
    # ------------------------------------------------------------------

    CreateLoadRequest:
      type: object
      required: [stops]
      properties:
        carrierId:
          type: string
          format: uuid
          nullable: true
        driverId:
          type: string
          format: uuid
          nullable: true
        vehicleId:
          type: string
          format: uuid
          nullable: true
        contactId:
          type: string
          format: uuid
          nullable: true
        customerId:
          type: string
          format: uuid
          nullable: true
        externalRefNumber:
          type: string
          maxLength: 255
        equipmentType:
          type: string
          enum: [DRY_VAN, REEFER, FLATBED, STEP_DECK, BOX_TRUCK, HOTSHOT, POWER_ONLY]
        isHazmat:
          type: boolean
        isTarp:
          type: boolean
        isTeamDriver:
          type: boolean
        loadedMiles:
          type: integer
          minimum: 0
        deadheadMiles:
          type: integer
          minimum: 0
        totalMiles:
          type: integer
          minimum: 0
        customerRate:
          type: number
          minimum: 0
        carrierRate:
          type: number
          minimum: 0
        status:
          $ref: '#/components/schemas/LoadStatus'
        dispatcherNotes:
          type: string
        driverInstructions:
          type: string
        stops:
          type: array
          items:
            $ref: '#/components/schemas/StopInput'
          minItems: 1
          description: "Must contain at least one PICKUP and one DELIVERY. Scheduling type field enforcement applies."
        accessorialCharges:
          type: array
          items:
            $ref: '#/components/schemas/AccessorialChargeInput'

    UpdateLoadRequest:
      type: object
      properties:
        carrierId:
          type: string
          format: uuid
          nullable: true
        driverId:
          type: string
          format: uuid
          nullable: true
        vehicleId:
          type: string
          format: uuid
          nullable: true
        contactId:
          type: string
          format: uuid
          nullable: true
        customerId:
          type: string
          format: uuid
          nullable: true
        externalRefNumber:
          type: string
          maxLength: 255
        equipmentType:
          type: string
          enum: [DRY_VAN, REEFER, FLATBED, STEP_DECK, BOX_TRUCK, HOTSHOT, POWER_ONLY]
        isHazmat:
          type: boolean
        isTarp:
          type: boolean
        isTeamDriver:
          type: boolean
        loadedMiles:
          type: integer
          minimum: 0
        deadheadMiles:
          type: integer
          minimum: 0
        totalMiles:
          type: integer
          minimum: 0
        customerRate:
          type: number
          minimum: 0
        carrierRate:
          type: number
          minimum: 0
        status:
          $ref: '#/components/schemas/LoadStatus'
        dispatcherNotes:
          type: string
        driverInstructions:
          type: string
        stops:
          type: array
          items:
            $ref: '#/components/schemas/StopInput'
          minItems: 1
          description: "Atomic replace. Scheduling type field enforcement applies."
        accessorialCharges:
          type: array
          items:
            $ref: '#/components/schemas/AccessorialChargeInput'

    # ------------------------------------------------------------------
    # Accessorial charge schemas
    # ------------------------------------------------------------------

    AccessorialChargeInput:
      type: object
      required: [type, amount]
      properties:
        type:
          $ref: '#/components/schemas/AccessorialType'
        description:
          type: string
          maxLength: 500
        amount:
          type: number
          minimum: 0
        billTo:
          type: string
          enum: [customer, carrier]
          default: customer
        isAutoGenerated:
          type: boolean
          default: false

    AutoGeneratedDetentionCharge:
      type: object
      description: "Schema for auto-generated detention charges created by the system"
      required: [type, amount, billTo, approvalStatus, isAutoGenerated, stopId, description]
      properties:
        type:
          type: string
          enum: [DETENTION]
        amount:
          type: number
          minimum: 0
          description: "ceil(excessHours) * defaultDetentionRate"
        billTo:
          type: string
          enum: [customer]
          default: customer
        approvalStatus:
          type: string
          enum: [PENDING]
          default: PENDING
        isAutoGenerated:
          type: boolean
          enum: [true]
        stopId:
          type: string
          format: uuid
          description: "FK to Stop that triggered the detention. Used for duplicate prevention."
        description:
          type: string
          description: "Auto-generated: e.g., 'Auto-detected: 4.5hr wait at ABC Warehouse, Dallas TX'"

    # ------------------------------------------------------------------
    # Status transition schemas
    # ------------------------------------------------------------------

    TransitionStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/LoadStatus'
        notes:
          type: string
          maxLength: 2000
          description: "Required for certain transitions (e.g., EXCEPTION, CANCELED)"
        overrideWarnings:
          type: boolean
          default: false
          description: "Set to true to proceed despite warnings (e.g., missing appointment number)"

    StatusTransitionWarning:
      type: object
      required: [code, message]
      properties:
        code:
          $ref: '#/components/schemas/DispatchGateWarningCode'
        message:
          type: string
          description: "Human-readable warning message"
        detail:
          type: string
          description: "Additional context (e.g., stop sequence number)"

    StatusTransitionResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
        load:
          type: object
          description: "Full LoadDetailResponse (existing shape, not redefined here)"
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/StatusTransitionWarning'
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string

    # ------------------------------------------------------------------
    # Response envelopes
    # ------------------------------------------------------------------

    SingleLoadResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          description: "LoadDetailResponse (existing shape)"

    SingleStopResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          description: "StopResponse (existing shape)"

    ErrorResponse:
      type: object
      required: [errors]
      properties:
        errors:
          type: array
          items:
            type: object
            required: [message]
            properties:
              message:
                type: string
              field:
                type: string

    # ------------------------------------------------------------------
    # Domain events (for subscriber documentation)
    # ------------------------------------------------------------------

    DetentionDetectedEvent:
      type: object
      description: "Domain event emitted when detention is auto-detected"
      required: [type, occurredAt, payload]
      properties:
        type:
          type: string
          enum: ["load.detention.detected"]
        occurredAt:
          type: string
          format: date-time
        payload:
          type: object
          required: [loadId, organizationId, loadNumber, stopId, stopSequence, waitHours, billableHours, rate, amount]
          properties:
            loadId:
