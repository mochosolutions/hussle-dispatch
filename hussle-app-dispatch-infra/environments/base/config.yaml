dokploy:
  base_url: 'http://localhost:3000'

project:
  name: 'fleet-command'
  create_if_missing: true

compose:
  name: 'fleet-compose'
  type: 'docker-compose'
  github:
    owner: 'mochosolutions'
    repo: 'hussle-dispatch'
    compose_path: './docker-compose-prod.yml'

services:
  - name: 'api'
    port: 3001
    check_conflicts: false
  - name: 'ui'
    port: 3000
    check_conflicts: false

deployment:
  health_endpoints: []
  wait_for_health: false
  health_check_timeout: 300
  health_check_interval: 10

rollback:
  enabled: true
  delete_domains: true
  delete_compose: false
  delete_project: false

# Maps Terraform output paths (dot notation for nested) to .env variable names.
# fill-env reads these and writes them automatically — no manual copy-paste needed.
terraform_outputs:
  DOMAIN: domain_name
  ECR_REGISTRY: ecr_registry_url
  S3_BUCKET: uploads_bucket_name
  COGNITO_USER_POOL_ID: cognito_user_pool_id
  COGNITO_CLIENT_ID: cognito_client_id
  AWS_ACCESS_KEY_ID: api_runtime_credentials.access_key_id
  AWS_SECRET_ACCESS_KEY: api_runtime_credentials.secret_access_key

# Variables auto-generated by fill-env (openssl rand -hex 32) when empty.
auto_generate:
  - JWT_SECRET
  - REFRESH_SECRET

# Variables skipped by fill-env — set per-deploy by make build-push.
skip_in_fill:
  - IMAGE_TAG

# Deploy credentials — prompted by fill-env and stored in .env,
# but NOT sent to Dokploy containers (not in environment.required/optional).
deploy_credentials:
  - DOKPLOY_API_TOKEN

environment:
  required:
    - DOMAIN
    - ECR_REGISTRY
    - IMAGE_TAG
    - POSTGRES_USER
    - POSTGRES_PASSWORD
    - POSTGRES_DB
    - RABBITMQ_DEFAULT_PASS
    - JWT_SECRET
    - REFRESH_SECRET
    - AWS_REGION
    - AWS_ACCESS_KEY_ID
    - AWS_SECRET_ACCESS_KEY
    - S3_BUCKET
    - STORAGE_BACKEND
    - SMS_BACKEND
    - SES_FROM_EMAIL
    - COGNITO_USER_POOL_ID
    - COGNITO_CLIENT_ID
    - TWILIO_ACCOUNT_SID
    - TWILIO_AUTH_TOKEN
    - TWILIO_FROM_NUMBER
    - ALLOW_ORIGINS
    - FRONTEND_URL
    - TRACKING_BASE_URL
    - PUBLIC_SHORT_BASE_URL
    - API_HOST
    - UI_HOST
