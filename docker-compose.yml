services:
  dispatch-ui:
    build:
      context: .
      dockerfile: hussle-app-dispatch-ui/Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./hussle-app-dispatch-ui/src:/app/hussle-app-dispatch-ui/src
      - ./hussle-app-dispatch-ui/public:/app/hussle-app-dispatch-ui/public
      - ./hussle-app-dispatch-ui/index.html:/app/hussle-app-dispatch-ui/index.html
      - ./hussle-app-dispatch-ui/vite.config.ts:/app/hussle-app-dispatch-ui/vite.config.ts
      - ./hussle-app-dispatch-ui/tsconfig.json:/app/hussle-app-dispatch-ui/tsconfig.json
      - ./hussle-app-dispatch-ui/tsconfig.app.json:/app/hussle-app-dispatch-ui/tsconfig.app.json
      - ./hussle-app-dispatch-ui/tsconfig.node.json:/app/hussle-app-dispatch-ui/tsconfig.node.json
      - ./mocho-ui/src:/app/mocho-ui/src
    working_dir: /app/hussle-app-dispatch-ui
    command: npx vite --host 0.0.0.0
    environment:
      - CHOKIDAR_USEPOLLING=true

  storybook:
    build:
      context: .
      dockerfile: mocho-ui/Dockerfile.dev
    ports:
      - "6006:6006"
    volumes:
      - ./mocho-ui/src:/app/mocho-ui/src
      - ./mocho-ui/.storybook:/app/mocho-ui/.storybook
    working_dir: /app/mocho-ui
    command: npx storybook dev -p 6006 --host 0.0.0.0 --no-open
    environment:
      - CHOKIDAR_USEPOLLING=true

