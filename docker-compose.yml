services:
  dispatch-ui:
    build:
      context: ./hussle-app-dispatch-ui
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./hussle-app-dispatch-ui:/usr/app
      - /usr/app/node_modules
    command: npx vite --host 0.0.0.0 --force
    environment:
      - CHOKIDAR_USEPOLLING=true
      # Vite dev proxy at /docuseal-embed/* forwards to this URL and strips
      # x-frame-options so the AgreementSigningStep iframe can render the
      # DocuSeal signing page. Resolves via the docker network.
      - DOCUSEAL_PROXY_TARGET=http://hussle-app-docuseal:3000
  dispatch-api:
    build:
      context: ./hussle-app-dispatch-api
      dockerfile: Dockerfile.dev
    ports:
      - "3001:3001"
    command: sh -c 'sh ./scripts/migrate-and-start.sh --dev'
    volumes:
      - ./hussle-app-dispatch-api:/usr/app
      - /usr/app/node_modules
    env_file:
      - ./hussle-app-dispatch-api/.env
    environment:
      # HTTP-only role: no subscribers, no crons (those run in dispatch-worker)
      - ROLE=api
      # Ratecon ingest — docker-network hostnames (override .env localhost values)
      - PYTHON_SERVICE_URL=http://python-service:8000
      - PYTHON_SERVICE_TOKEN=dev
      - RATECON_WEBHOOK_SECRET=dev
      - RATECON_INBOUND_DOMAIN=notify.localhost
      - RATECON_DEV_MAILPIT_INBOUND=true
      - MAILPIT_API_URL=http://hussle-app-mailpit:8025
    depends_on:
      hussle-app-redis:
        condition: service_healthy
      hussle-app-postgres:
        condition: service_healthy
      hussle-app-rabbitmq:
        condition: service_healthy
      python-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Background worker: subscribers + crons (ROLE=worker). Same image as dispatch-api.
  # Reuses migrate-and-start (idempotent migrate; api migrates first via depends_on).
  dispatch-worker:
    build:
      context: ./hussle-app-dispatch-api
      dockerfile: Dockerfile.dev
    command: sh -c 'sh ./scripts/migrate-and-start.sh --dev'
    ports:
      - "3002:3002"
    volumes:
      - ./hussle-app-dispatch-api:/usr/app
      - /usr/app/node_modules
    env_file:
      - ./hussle-app-dispatch-api/.env
    environment:
      - ROLE=worker
      - WORKER_HEALTH_PORT=3002
      - PYTHON_SERVICE_URL=http://python-service:8000
      - PYTHON_SERVICE_TOKEN=dev
      - RATECON_WEBHOOK_SECRET=dev
      - RATECON_INBOUND_DOMAIN=notify.localhost
      - RATECON_DEV_MAILPIT_INBOUND=true
      - MAILPIT_API_URL=http://hussle-app-mailpit:8025
    depends_on:
      hussle-app-redis:
        condition: service_healthy
      hussle-app-postgres:
        condition: service_healthy
      hussle-app-rabbitmq:
        condition: service_healthy
      python-service:
        condition: service_started
      dispatch-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # WebSocket gateway: socket.io + Redis adapter, holds client sockets only
  # (ROLE=ws-gateway). Same image as dispatch-api; no app routers/crons.
  ws-gateway:
    build:
      context: ./hussle-app-dispatch-api
      dockerfile: Dockerfile.dev
    command: sh -c 'sh ./scripts/migrate-and-start.sh --dev'
    ports:
      - "3003:3003"
      - "3004:3004"
    volumes:
      - ./hussle-app-dispatch-api:/usr/app
      - /usr/app/node_modules
    env_file:
      - ./hussle-app-dispatch-api/.env
    environment:
      - ROLE=ws-gateway
      - WS_GATEWAY_HEALTH_PORT=3003
      - WS_GATEWAY_PORT=3004
      - PYTHON_SERVICE_URL=http://python-service:8000
      - PYTHON_SERVICE_TOKEN=dev
      - RATECON_WEBHOOK_SECRET=dev
      - RATECON_INBOUND_DOMAIN=notify.localhost
      - RATECON_DEV_MAILPIT_INBOUND=true
      - MAILPIT_API_URL=http://hussle-app-mailpit:8025
    depends_on:
      hussle-app-redis:
        condition: service_healthy
      hussle-app-postgres:
        condition: service_healthy
      hussle-app-rabbitmq:
        condition: service_healthy
      dispatch-api:
        condition: service_healthy
    deploy:
      # Intentionally single-replica for local/dev. The socket.io Redis adapter
      # is wired and ready for horizontal scale-out; bump this to >=2 (and run
      # behind a sticky/LB) in staging/prod to exercise cross-replica fan-out.
      replicas: 1
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  python-service:
    build:
      context: ./hussle-app-dispatch-py
      dockerfile: Dockerfile.dev
    container_name: hussle-app-python-service
    ports:
      - "8000:8000"
    volumes:
      - ./hussle-app-dispatch-py/app:/usr/app/app
      - ./hussle-app-dispatch-py/scripts:/usr/app/scripts
      - ./hussle-app-dispatch-py/tests:/usr/app/tests
    env_file:
      - ./hussle-app-dispatch-py/.env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  hussle-app-postgres:
    image: postgres:15-alpine
    container_name: hussle-app-postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=hussle_dispatch
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  hussle-app-redis:
    image: redis/redis-stack:7.4.0-v2
    container_name: hussle-app-redis
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  hussle-app-rabbitmq:
    image: fleet-command/rabbitmq:3.13-delayed
    build:
      context: ./docker/rabbitmq
    container_name: hussle-app-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: hussle-app-pgadmin
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@local.dev
      - PGADMIN_DEFAULT_PASSWORD=admin
    depends_on:
      - hussle-app-postgres

  mailpit:
    image: axllent/mailpit:latest
    container_name: hussle-app-mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      # On each received message, notify the API's dev ratecon inbound webhook.
      # The handler ignores anything not addressed to ratecon+<orgId>@...
      - MP_WEBHOOK_URL=http://dispatch-api:3001/api/v1/webhooks/ratecon/mailpit-inbound
    restart: unless-stopped

  # DocuSeal — optional. Start with `docker compose --profile docuseal up -d docuseal`.
  # Default `docker compose up` skips it; the dispatch-api falls back to the deterministic
  # mock signature provider unless SIGNATURE_PROVIDER=docuseal in .env.
  docuseal:
    image: docuseal/docuseal:latest
    container_name: hussle-app-docuseal
    ports:
      - "3030:3000"
    environment:
      FORCE_SSL: "false"
      HOST: localhost:3030
    volumes:
      - docuseal-data:/data
    restart: unless-stopped
    profiles: ["docuseal"]

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  docuseal-data:
  # redisinsight-data:
