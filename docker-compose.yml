  dispatch-api:
    build:
      context: ./hussle-app-dispatch-api
      dockerfile: Dockerfile.dev
    ports:
      - "3001:3001"
    command: sh -c 'sh ./scripts/migrate-and-start.sh --dev --db-name "$${DB_NAME}"'
    volumes:
      - ./hussle-app-dispatch-api:/usr/app
      - api-node_modules:/usr/app/node_modules
    depends_on:
      hussle-app-redis:
        condition: service_healthy
      hussle-app-postgres:
        condition: service_healthy
    environment:
      - DB_NAME=hussle_dispatch
      - DATABASE_URL=postgresql://postgres:postgres@hussle-app-postgres:5432/hussle_dispatch
      - REDIS_URL=redis://hussle-app-redis:6379
      - PORT=3001
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=300
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  hussle-app-postgres:
    image: postgres:15-alpine
    container_name: hussle-app-postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=hussle_dispatch
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  hussle-app-redis:
    image: redis:7-alpine
    container_name: hussle-app-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
  api-node_modules:
  # redisinsight-data:
